name: Apply transaction performance fix

on:
  push:
    branches:
      - agent/optimize-transaction-performance
    paths:
      - .github/workflows/apply-performance-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/optimize-transaction-performance
          fetch-depth: 0

      - name: Rebuild and apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/performance-fix/part-00.patch .github/performance-fix/part-01.patch > /tmp/performance.patch
          base64 --decode .github/performance-fix/part-02.b64 >> /tmp/performance.patch
          cat .github/performance-fix/part-03-*.b64 | base64 --decode >> /tmp/performance.patch
          cat .github/performance-fix/part-04-*.b64 | base64 --decode >> /tmp/performance.patch
          cat .github/performance-fix/part-05-*.b64 | base64 --decode >> /tmp/performance.patch

          git apply --check /tmp/performance.patch
          git apply /tmp/performance.patch

          test "$(git hash-object apps/web/index.html)" = "447e272abc437a84e1c0a829b90a23487c2f2d45"
          test "$(git hash-object apps/web/src/legacy-app.js)" = "dc1db2781c1567341f62a1b9ceb807baeda75c45"
          test "$(git hash-object apps/web/src/legacy-cloud.js)" = "4cdcbb5d7fd5096f5918d3103ff20d084e490c84"
          test "$(git hash-object apps/web/src/legacy-styles.css)" = "8d188f57895d2975b6996d29c0d6aae890154c13"
          test "$(git hash-object apps/api/src/modules/app-state/routes.ts)" = "9d1b61ad9d5e2bc96afb3485bca061d0891daf9e"

          node --check apps/web/src/legacy-app.js
          node --check apps/web/src/legacy-cloud.js

          rm -rf .github/performance-fix
          rm -f .github/workflows/apply-performance-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/index.html apps/web/src/legacy-app.js apps/web/src/legacy-cloud.js apps/web/src/legacy-styles.css apps/api/src/modules/app-state/routes.ts .github
          git commit -m "Optimize transaction performance [skip ci]"
          git push origin HEAD:agent/optimize-transaction-performance
