name: MEG API Availability

on:
  schedule:
    # Horário de Brasília (UTC-3): 05:50 inicia o prewarm diário.
    - cron: '50 8 * * *'
    # 06:00–20:50 BRT, a cada 10 minutos.
    - cron: '*/10 9-23 * * *'
    # 21:00–21:50 BRT, a cada 10 minutos.
    - cron: '*/10 0 * * *'
  workflow_dispatch:

concurrency:
  group: meg-api-availability
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Keep MEG API warm during daily use window
        env:
          API_URL: ${{ vars.VITE_API_URL || 'https://meg-platform-api.onrender.com' }}
        run: |
          for attempt in {1..3}; do
            if response=$(curl --silent --show-error --max-time 85 --fail "$API_URL/ready"); then
              echo "$response"
              exit 0
            fi
            echo "MEG API wake-up in progress (attempt $attempt/3)"
            sleep 10
          done
          echo "MEG API readiness check failed"
          exit 1
