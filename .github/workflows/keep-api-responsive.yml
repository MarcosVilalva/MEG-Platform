name: MEG API Availability

on:
  schedule:
    # Mantém a API disponível durante o período de uso. O plano grátis do
    # Render hiberna após 15 minutos sem tráfego; 14 minutos evita cold start
    # sem manter a instância ativa durante toda a madrugada.
    - cron: '*/14 0-2,9-23 * * *'
    # Acorda 10 minutos antes dos alertas de 06:00, 12:00 e 19:00.
    - cron: '50 8 * * *'
    - cron: '50 14 * * *'
    - cron: '50 21 * * *'
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Warm free API safely
        env:
          API_URL: ${{ vars.VITE_API_URL || 'https://meg-platform-api.onrender.com' }}
        run: |
          for attempt in {1..3}; do
            if response=$(curl --silent --show-error --max-time 85 --fail "$API_URL/ready"); then
              echo "$response"
              exit 0
            fi
            echo "Cold start in progress (attempt $attempt/3)"
            sleep 10
          done
          echo "MEG API health check failed"
          exit 1
