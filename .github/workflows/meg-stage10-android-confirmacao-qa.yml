name: MEG Stage10 Android confirmation APK QA
on:
  push:
    branches: [stage10/android-confirmacao-qa-20261118, stage10/p0-public-review-20261123]
    paths:
      - '.github/workflows/meg-stage10-android-confirmacao-qa.yml'
      - 'package-lock.json'
      - 'apps/api/package.json'
      - 'apps/web/package.json'
      - 'android/**'
      - 'apps/web/src/mobile/MegMobileLaunchSheet.tsx'
      - 'apps/api/src/modules/finance/stage10-qa-web-android-create.isolated.test.ts'
      - 'apps/api/src/modules/finance/stage10-historical-review-report.ts'
      - 'apps/web/src/phoenix/simple-event-form-bridge.ts'
      - 'apps/web/src/phoenix/data/phoenix-write-gateway.ts'
      - 'apps/web/src/instant-persistence.js'
      - 'scripts/meg-stage10-*.sh'
      - 'scripts/meg-stage10-apk708-runtime.contract.mjs'
      - 'scripts/meg-stage10-android-emulator-smoke.mjs'

permissions:
  contents: read

jobs:
  build-qa-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute historical and corrected confirmation contracts
        run: |
          git fetch --depth=1 --no-tags origin 36c886b9597be95a28eb2add00f073e5f43f6fe0
          timeout 30 node --experimental-vm-modules scripts/meg-stage10-apk708-runtime.contract.mjs
      - run: npm ci --audit=false --fund=false
      - name: Enforce unchanged full security gate before Android QA build
        run: node scripts/npm-security-audit.mjs --audit-level=high
      - run: bash scripts/meg-stage10-build-android-qa.sh
      - name: Exercise the isolated APK in an Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          tools_dir=$(find -L "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$tools_dir"
          export PATH="$(dirname "$tools_dir"):$ANDROID_HOME/platform-tools:$PATH"
          image='system-images;android-35;google_apis;x86_64'
          sdkmanager "emulator" "$image"
          export ANDROID_USER_HOME="$RUNNER_TEMP/stage10-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --name meg-stage10 --package "$image" --path "$ANDROID_AVD_HOME/meg-stage10.avd" <<< no
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx 'meg-stage10'
          "$ANDROID_HOME/emulator/emulator" @meg-stage10 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$RUNNER_TEMP/stage10-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill >/dev/null 2>&1 || true' EXIT
          export ANDROID_SERIAL=emulator-5554
          if ! timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do kill -0 "$1" || exit 1; sleep 3; done' -- "$emulator_pid"; then
            tail -80 "$RUNNER_TEMP/stage10-emulator.log"
            exit 1
          fi
          adb shell input keyevent 82
          adb install android/app/build/outputs/apk/stage10Qa/app-stage10Qa.apk
          node scripts/meg-stage10-android-emulator-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: meg-stage10-android-confirmacao-qa
          path: android/app/build/outputs/apk/stage10Qa/app-stage10Qa.apk
          if-no-files-found: error
          retention-days: 7
  verify-pg17-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: meg_stage10_sandbox
          POSTGRES_USER: meg_stage10_ci
          POSTGRES_PASSWORD: stage10_ci_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meg_stage10_ci -d meg_stage10_sandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://meg_stage10_ci:stage10_ci_disposable_only@127.0.0.1:5432/meg_stage10_sandbox?schema=public
      MEG_STAGE10_ISOLATED_PG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --audit=false --fund=false
      - run: npm run db:generate
      - run: npx --no-install prisma db push --schema packages/database/prisma/schema.prisma --skip-generate
      - run: node --import tsx apps/api/src/modules/finance/stage10-qa-web-android-create.isolated.test.ts
