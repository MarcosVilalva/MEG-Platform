          helper = '''const DIACRITIC_PATTERN = /[\\u0300-\\u036f]/g;

function normalizeEntry(entry) {
  if (typeof entry === "string" || typeof entry === "number") {
    const value = String(entry);
    return { value, label: value, disabled: false };
  }
  return {
    value: String(entry?.value ?? ""),
    label: String(entry?.label ?? entry?.value ?? ""),
    disabled: Boolean(entry?.disabled),
  };
}

export function normalizeNativeOptionText(value) {
  return String(value ?? "")
    .normalize("NFD")
    .replace(DIACRITIC_PATTERN, "")
    .trim()
    .toUpperCase();
}

export function nativeOptionSignature(entries) {
  return entries
    .map(normalizeEntry)
    .map((entry) => `${entry.value}\\u0001${entry.label}\\u0001${entry.disabled ? "1" : "0"}`)
    .join("\\u0002");
}

export function resolveNativeOption(entries, preferredValue = "") {
  const normalized = entries.map(normalizeEntry);
  const preferred = String(preferredValue ?? "");
  return normalized.find((entry) => entry.value === preferred && !entry.disabled)
    || normalized.find((entry) => !entry.disabled)
    || normalized[0]
    || null;
}

export function replaceNativeSelectOptions(select, entries, preferredValue = "") {
  if (!select) return "";
  const normalized = entries.map(normalizeEntry);
  const signature = nativeOptionSignature(normalized);
  if (select.dataset.nativeOptionsSignature !== signature) {
    const fragment = document.createDocumentFragment();
    for (const entry of normalized) {
      const option = document.createElement("option");
      option.value = entry.value;
      option.textContent = entry.label;
      option.disabled = entry.disabled;
      fragment.append(option);
    }
    select.replaceChildren(fragment);
    select.dataset.nativeOptionsSignature = signature;
  }
  const selected = resolveNativeOption(normalized, preferredValue ?? select.value);
  select.value = selected?.value ?? "";
  return select.value;
}
'''

          helper_test = '''import assert from "node:assert/strict";
import { nativeOptionSignature, normalizeNativeOptionText, resolveNativeOption } from "./native-select-options.js";

assert.equal(normalizeNativeOptionText("  Cartão Itaú  "), "CARTAO ITAU");
assert.equal(nativeOptionSignature(["PIX", "DINHEIRO"]), nativeOptionSignature(["PIX", "DINHEIRO"]));
assert.notEqual(nativeOptionSignature(["PIX"]), nativeOptionSignature(["DINHEIRO"]));
assert.equal(resolveNativeOption([{ value: "", label: "Selecione" }, { value: "pix", label: "PIX" }], "pix")?.value, "pix");
assert.equal(resolveNativeOption([{ value: "x", label: "X", disabled: true }, { value: "y", label: "Y" }], "x")?.value, "y");
console.log("MEG native select tests passed.");
'''

