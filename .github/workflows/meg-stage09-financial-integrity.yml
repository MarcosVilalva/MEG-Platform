name: MEG Stage09 Financial Integration PostgreSQL17 (synthetic only)

on:
  pull_request:
    paths:
      - '.github/workflows/meg-stage09-financial-integrity.yml'
      - 'apps/api/src/modules/finance/**'
      - 'apps/api/src/modules/payables/**'
      - 'apps/api/src/modules/cards/**'
      - 'apps/api/src/modules/app-state/**'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/package.json'
      - 'apps/api/package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg17-disposable-financial-writers:
    # O escopo e exclusivamente a PR #666 ou chamada manual intencional.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'stage09/backup-recovery-kit-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/meg_stage09_synthetic?schema=public
      NODE_ENV: test
      MEG_STAGE09_SYNTHETIC_ONLY: 'YES'
      CORS_ORIGINS: http://localhost:5173
    services:
      postgres17:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: meg_stage09_synthetic
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d meg_stage09_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refuse any non-synthetic or non-local target
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.env.CI, 'true');
          assert.equal(process.env.MEG_STAGE09_SYNTHETIC_ONLY, 'YES');
          assert.equal(
            process.env.DATABASE_URL,
            'postgresql://ci:ci@127.0.0.1:5432/meg_stage09_synthetic?schema=public'
          );
          console.log('STAGE09_TARGET=LOCAL_EPHEMERAL_PG17_ONLY');
          NODE
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Create schema ONLY in disposable PostgreSQL 17
        run: npm run db:push
      - name: Existing RC1 E2E on PostgreSQL17 with synthetic records
        run: npm --workspace apps/api run test:rc1-financial-e2e
      - name: Stage09 protected writers and rollback E2E on PostgreSQL17
        run: npm exec --workspace apps/api -- tsx src/modules/finance/stage09-protected-write-e2e.test.ts
      - name: Stage09 payables and card statement writers on PostgreSQL17
        run: npm exec --workspace apps/api -- tsx src/modules/finance/stage09-card-payable-e2e.test.ts
      - name: Stage09 concurrency between payable and card writers on PostgreSQL17
        run: npm exec --workspace apps/api -- tsx src/modules/finance/stage09-payable-card-concurrency-e2e.test.ts
      - name: No production material supplied
        if: always()
        run: |
          echo 'STAGE09_PRODUCTION=NOT_ACCESSED'
          echo 'STAGE09_WSL_RESTORE=NOT_ACCESSED'
          echo 'STAGE09_VAULT=NOT_ACCESSED'
          echo 'STAGE09_PG17_CONTAINER=EPHEMERAL'
