name: MEG Stage09 - Web integrada Home + Lancamentos isolada
on:
  push:
    branches:
      - 'integration/09-web-home-p0-20261111'
      - 'stage08/home-launches-closeout-20261112'
      - 'stage08/lancamentos-icons-refinement-20261112'
      - 'stage08/prism-typography-system-pilot-20261112'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-home-launches:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NODE_ENV: test
      PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Bloquear divergencia dos componentes visuais homologados
        run: |
          set -euo pipefail
          check_blob() {
            local file="$1" expected="$2" actual
            actual="$(git hash-object "$file")"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$file::REGRESSAO_VISUAL_SEM_AUTORIZACAO: $file difere da PR aprovada; exige nova validacao visual."
              echo "Esperado: $expected, atual: $actual"
              exit 1
            fi
            echo "Visual homologado preservado: $file"
          }
          # Home P0 autorizada (PR #669)
          check_blob apps/web/src/meg-web-evolution/home/HomeDashboard.tsx 9ccb041d72088db1f071bad2c82965c564f73743
          # Revisão da PR #679: pack anterior reprovado; MEG Prism 3D na versão autenticada, somente novos glifos e estilo do botão. Aprovação visual ainda pendente.
          check_blob apps/web/src/meg-web-evolution/launches/LaunchesStage09.tsx d95227c074a5f458e1981a06d71f73105661b6e5
          check_blob apps/web/src/meg-web-evolution/launches/launches-stage09.css 650d5dcfe4a8fdeb4d9fceda335c82c42b89b86c
          check_blob apps/web/src/meg-web-evolution/launches/LaunchCategoryBadge.tsx 72a822a3fde5a38f5ec791af3e4f03527beb630b
          check_blob apps/web/src/meg-web-evolution/launches/LaunchPaymentBadge.tsx b276bb0fd422ea601ca91af4774c97646ba79055
      - name: Instalar dependencias e gerar Prisma sem banco
        run: |
          npm ci --audit=false
          npm run db:generate
      - name: Build API e protecoes financeiras
        run: |
          npm run build:api
          npm run test:finance
          npm run test:cors
          npm run test:security
      - name: Contratos de Lancamentos e Home
        run: |
          npx tsx scripts/meg-stage09-history-snapshot.contract.test.ts
          npx tsx scripts/meg-stage09-category-visual.contract.test.ts
          npx tsx scripts/meg-stage09-saved-filters.contract.test.ts
          npx tsx scripts/meg-stage09-card-nextstage-characterization.test.ts
          npx tsx apps/web/src/meg-web-evolution/home/home-commitments-read.contract.test.ts
          npx tsx scripts/meg-stage09-filtered-summary.contract.test.ts
      - name: Build da preview e entrada autenticada sem publicar
        run: cd apps/web && npx vite build --config vite.fluxo-integrado-08.config.ts
      - name: Compilar entrada funcional QA isolada sem API externa
        run: cd apps/web && NODE_ENV=production npx vite build --config vite.stage08-funcional-qa.config.ts
      - name: Testar gateway somente leitura com artefatos locais do build
        run: |
          set -euo pipefail
          mkdir -p apps/web/dist
          cp -a apps/web/dist-fluxo-integrado-08/. apps/web/dist/
          node --test scripts/meg-stage09-readonly-gateway.test.mjs
      - name: Instalar Playwright isoladamente
        run: npm install --no-save --package-lock=false --audit=false @playwright/test@1.64.0
      - name: QA funcional estática Etapa 08 em navegador real
        run: |
          set -euo pipefail
          python3 -m http.server 4175 --directory apps/web/dist-stage08-funcional-qa >/tmp/meg-stage08-static.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/stage08-funcional-qa.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/meg-stage08-static-qa.browser.mjs
          node scripts/meg-stage08-lancamentos-icons.browser.mjs
          node scripts/meg-stage08-prism-typography.browser.mjs
      - name: QA de Home, atalhos, Lancamentos e sessao em Chrome
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory apps/web/dist-fluxo-integrado-08 >/tmp/meg-stage09-web-integration.log 2>&1 &
          PID=$!
          python3 -m http.server 4174 --directory apps/web/dist-fluxo-integrado-08 >/tmp/meg-stage09-auth-integration.log 2>&1 &
          PID2=$!
          trap 'kill "$PID" "$PID2" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/fluxo-integrado-08.html >/dev/null && curl -fsS http://127.0.0.1:4174/web-evolution.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/web-evolution.html >/dev/null
          node scripts/meg-06-home-refino.browser.mjs
          node scripts/meg-08-home-quick-actions.browser.mjs
          node scripts/meg-stage09-lancamentos.browser.mjs
          node scripts/meg-stage09-approved-visual.browser.mjs
          node scripts/meg-stage09-shell-continuity.browser.mjs
          node scripts/meg-stage09-operational.browser.mjs
          node scripts/meg-stage09-home-p0-preservation.browser.mjs
          node scripts/meg-stage08-home-navigation.browser.mjs
      - name: Bloquear alteracoes fora da Web Stage09 isolada
        run: |
          set -euo pipefail
          BASE=17117fa870d92f890596c470c225d2d643127a0d
          git diff --name-only "$BASE" HEAD > /tmp/stage09-web-files.txt
          cat /tmp/stage09-web-files.txt
          while IFS= read -r path; do
            case "$path" in
              apps/web/src/meg-web-evolution/launches/*|apps/web/src/meg-web-evolution/main.tsx|apps/web/src/meg-web-evolution/home/HomeDashboard.tsx|apps/web/src/meg-web-evolution/stage08-qa/*|apps/web/stage08-funcional-qa.html|apps/web/vite.stage08-funcional-qa.config.ts|apps/web/src/meg-web-evolution/shell/AppShell.tsx|apps/web/src/meg-web-evolution/shell/shell.css|apps/web/src/meg-web-evolution/datagrid/DataGrid.tsx|apps/web/src/meg-web-evolution/datagrid/types.ts|apps/web/src/app/finance-client.ts|apps/web/src/meg-web-evolution/integrated-preview/preview.tsx|apps/web/src/meg-web-evolution/home/home-p0-qa.preview.fixture.ts|apps/web/src/meg-web-evolution/home/home-due-alerts.css|apps/web/src/meg-web-evolution/auth/login.css|scripts/meg-06-home-refino.browser.mjs|scripts/meg-08-home-quick-actions.browser.mjs|scripts/meg-stage09-*.browser.mjs|scripts/meg-stage08-home-navigation.browser.mjs|scripts/meg-stage08-lancamentos-icons.browser.mjs|scripts/meg-stage08-prism-typography.browser.mjs|scripts/meg-stage08-static-qa.browser.mjs|scripts/meg-stage09-readonly-gateway.mjs|scripts/meg-stage09-readonly-gateway.test.mjs|scripts/meg-stage09-*contract.test.ts|scripts/meg-stage09-card-nextstage-characterization.test.ts|.github/workflows/meg-stage08-static-functional-qa.yml|.github/workflows/meg-stage09-web-home-integrated-qa.yml|docs/MEG-WEB-ICONOGRAFIA-PRISM-20261112.md|docs/MEG-WEB-IDENTIDADE-PRISM-2-0-PLANO-20261112.md|docs/MEG-STAGE08-HOME-LAUNCHES-CLOSEOUT-20261112.md|docs/MEG-STAGE09-WEB-HOME-INTEGRATION-QA-20261111.md|MEG-WEB-CONTINUIDADE-OFICIAL.md)
                ;;
              *) echo "MUDANCA NAO AUTORIZADA: $path"; exit 1;;
            esac
          done < /tmp/stage09-web-files.txt
      - name: Evidencias das oito larguras, autenticação e Home
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meg-stage09-web-integration-qa
          path: |
            artifacts/meg-stage09-lancamentos/
            artifacts/meg-stage09-approved/
            artifacts/meg-stage09-operational/
            artifacts/meg-stage08-lancamentos-icons/
            artifacts/meg-home-refino-06/
            artifacts/meg-home-p0-qa/
          if-no-files-found: warn
          retention-days: 7
