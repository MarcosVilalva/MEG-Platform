name: TEMP DataGrid authorized responsive baselines
on:
  push:
    branches:
      - 'meg-web-evolution/tmp-pr606-toolbar-600-760-verify'
permissions:
  contents: write
jobs:
  snapshots:
    if: github.event.head_commit.message != 'test(datagrid): record authorized 640-680 responsive snapshots'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --audit=false
      - run: npm install --no-save --package-lock=false --audit=false @playwright/test@1.64.0 @axe-core/playwright@4.13.0
      - name: Update only authorized changed visual baselines
        shell: bash
        run: |
          set -eu
          VITE_PUBLIC_BASE_PATH=/ npm --workspace apps/web run dev -- --host 127.0.0.1 --port 4173 > /tmp/meg-temp-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/datagrid-harness.html >/dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_CHROME_PATH="$(which google-chrome)" npx playwright test apps/web/src/meg-web-evolution/datagrid/datagrid.quality.playwright.spec.mjs --workers=1 --reporter=line --update-snapshots
          git diff --name-only > /tmp/changed-snapshots.txt
          cat /tmp/changed-snapshots.txt
          if grep -vE '^apps/web/src/meg-web-evolution/datagrid/datagrid.quality.playwright.spec.mjs-snapshots/datagrid-(640x600|680x400|680x600)-linux.png$' /tmp/changed-snapshots.txt | grep .; then
            echo 'ERROR: a protected snapshot or unexpected file changed.'
            exit 1
          fi
          test "$(wc -l < /tmp/changed-snapshots.txt)" -eq 3
      - name: Commit authorized baselines to TEMP branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/meg-web-evolution/datagrid/datagrid.quality.playwright.spec.mjs-snapshots/datagrid-640x600-linux.png
          git add apps/web/src/meg-web-evolution/datagrid/datagrid.quality.playwright.spec.mjs-snapshots/datagrid-680x400-linux.png
          git add apps/web/src/meg-web-evolution/datagrid/datagrid.quality.playwright.spec.mjs-snapshots/datagrid-680x600-linux.png
          git commit -m "test(datagrid): record authorized 640-680 responsive snapshots"
          git push origin HEAD:meg-web-evolution/tmp-pr606-toolbar-600-760-verify
