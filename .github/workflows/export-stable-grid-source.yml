name: Exportar fonte para filtros estaveis

on:
  push:
    branches:
      - agent/stable-header-grid-filters

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar fonte
        run: |
          zip -qr stable-grid-source.zip apps/web package.json package-lock.json -x '*/node_modules/*' '*/dist/*'
      - name: Publicar fonte
        uses: actions/upload-artifact@v4
        with:
          name: stable-grid-source
          path: stable-grid-source.zip
          retention-days: 1
