name: Apply web filter performance

on:
  push:
    branches:
      - agent/optimize-web-filters
    paths:
      - '.performance-patch/**'
      - '.github/workflows/apply-web-filter-performance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          test -d .performance-patch || exit 0
          cat .performance-patch/gz-* > /tmp/web-filter-performance.patch.gz.b64
          echo 'b77150520ea21d4fcb60d15eb7c074eb86977d5eb3033f4c2c75e995dcf0eec5  /tmp/web-filter-performance.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/web-filter-performance.patch.gz.b64 | gzip --decompress > /tmp/web-filter-performance.patch
          echo '14410bcc443765c608a998250ec384db5f34775ab79a6d610a0083e63e590df1  /tmp/web-filter-performance.patch' | sha256sum -c -
          git apply --check /tmp/web-filter-performance.patch
          git apply /tmp/web-filter-performance.patch

      - name: Validate JavaScript and financial rules
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/src/legacy-app.js
          node --check apps/web/src/legacy-finance.js
          node apps/web/src/legacy-finance.test.js
          node packages/core/src/tests/core.test.js

      - name: Commit optimized files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .performance-patch
          rm -f .github/workflows/apply-web-filter-performance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/legacy-app.js apps/web/src/legacy-finance.js .performance-patch .github/workflows/apply-web-filter-performance.yml
          git commit -m 'perf: optimize web filters and searches [skip ci]'
          git push
