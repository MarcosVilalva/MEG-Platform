name: Deploy MEG Platform to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production web application
        env:
          VITE_APP_ENV: production
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://meg-platform-api.onrender.com' }}
          VITE_PUBLIC_BASE_PATH: /MEG-Platform/
          VITE_PHOENIX_SIMPLE_EVENT_WRITE: enabled
          VITE_PHOENIX_CARD_PURCHASE_WRITE: enabled
          VITE_PHOENIX_BENEFIT_WRITE: ${{ vars.VITE_PHOENIX_BENEFIT_WRITE || 'disabled' }}
          VITE_PHOENIX_TRANSFER_WRITE: disabled
          VITE_PHOENIX_PENDING_WRITE: enabled
          VITE_PHOENIX_BULK_EVENT_WRITE: enabled
        run: npm run build:web

      - name: Verify Phoenix V15 is the official web entry
        run: |
          grep -q 'data-meg-shell="phoenix-v15"' apps/web/dist/index.html
          grep -q 'MEG Finanças' apps/web/dist/index.html

      - name: Wait for production API from this commit
        env:
          API_URL: ${{ vars.VITE_API_URL || 'https://meg-platform-api.onrender.com' }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          # /health.commit is populated from Render's RENDER_GIT_COMMIT.
          for attempt in {1..36}; do
            if health=$(curl --silent --show-error --fail --max-time 90 "$API_URL/health"); then
              actual=$(HEALTH="$health" node --input-type=module -e "const value=JSON.parse(process.env.HEALTH || '{}'); process.stdout.write(String(value.commit || ''))")
              if [ "$actual" = "$EXPECTED_COMMIT" ]; then
                echo "Production API is LIVE on $EXPECTED_COMMIT"
                exit 0
              fi
              echo "API commit is ${actual:-unknown}; waiting for $EXPECTED_COMMIT (attempt $attempt/36)"
            else
              echo "API not ready yet (attempt $attempt/36)"
            fi
            sleep 20
          done
          echo "Production API did not reach expected commit $EXPECTED_COMMIT before Pages publication."
          exit 1

      - name: Stage production artifact
        run: |
          rm -rf pages-artifact
          mkdir -p pages-artifact
          cp -r apps/web/dist/. pages-artifact/
          mkdir -p pages-artifact/downloads
          curl --fail --location --retry 3 --retry-all-errors \
            --output pages-artifact/downloads/MEG-Financas.apk \
            https://github.com/MarcosVilalva/MEG-Platform/releases/download/android-latest/MEG-Financas.apk
          curl --fail --location --retry 3 --retry-all-errors \
            --output pages-artifact/downloads/app-version.json \
            https://github.com/MarcosVilalva/MEG-Platform/releases/download/android-latest/app-version.json
          node --input-type=module - <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('pages-artifact/downloads/app-version.json', 'utf8'));
          const apk = fs.readFileSync('pages-artifact/downloads/MEG-Financas.apk');
          const actual = crypto.createHash('sha256').update(apk).digest('hex');
          if (actual !== manifest.sha256) throw new Error(`APK publicado não corresponde ao manifesto: ${actual}`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
