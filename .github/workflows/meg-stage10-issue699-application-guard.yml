name: MEG Stage10 Issue699 real application guard
on:
  push:
    branches: [stage10/p0-public-review-20261123]
    paths:
      - '.github/workflows/meg-stage10-issue699-application-guard.yml'
      - 'apps/web/src/instant-persistence.js'
      - 'apps/web/src/cloud-write-ahead-core.js'
      - 'apps/web/src/cloud-outbox-conflict-policy.js'
      - 'apps/web/src/stage10-issue699-real-outbox-flow.test.mjs'
      - 'apps/web/src/stage10-frozen-legacy-409-harness.test.js'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  js-application-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --audit=false --fund=false
      - name: Exercise real storage to outbox response-loss and retry
        run: node apps/web/src/stage10-issue699-real-outbox-flow.test.mjs
      - name: Characterize permanent 409 legacy client and postcommit replay
        run: node apps/web/src/stage10-frozen-legacy-409-harness.test.js
