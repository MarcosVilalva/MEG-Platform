name: MEG Stage09 Backup Recovery Safety (offline)

on:
  pull_request:
    paths:
      - 'scripts/meg-stage09-safe-backup.sh'
      - 'scripts/meg-stage09-safe-restore-drill.sh'
      - 'scripts/meg-stage09-safe-vault-rootkey.sh'
      - 'scripts/meg-stage09-audit-financial-invariants.sh'
      - 'scripts/meg-stage09-backup-safety.test.mjs'
      - 'docs/MEG-STAGE09-BACKUP-RECOVERY-RUNBOOK-20261110.md'
      - '.github/workflows/meg-stage09-backup-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (no production credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        shell: bash
        run: |
          bash -n scripts/meg-stage09-safe-backup.sh
          bash -n scripts/meg-stage09-safe-restore-drill.sh
          bash -n scripts/meg-stage09-safe-vault-rootkey.sh
          bash -n scripts/meg-stage09-audit-financial-invariants.sh
      - name: Run synthetic safety contract with mocked tools
        shell: bash
        run: node scripts/meg-stage09-backup-safety.test.mjs

  postgres17-synthetic-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code without production credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install age (synthetic recovery only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
      - name: Start disposable PostgreSQL 17 containers
        shell: bash
        run: |
          docker run -d --name meg-stage09-test-src -e POSTGRES_PASSWORD=LOCAL_TEST_ONLY postgres:17
          docker run -d --name meg-stage09-test-dst -e POSTGRES_PASSWORD=LOCAL_TEST_ONLY postgres:17
          for target in meg-stage09-test-src meg-stage09-test-dst; do
            ready=0
            # O entrypoint postgres inicializa um servidor temporario e depois
            # reinicia: uma unica resposta positiva do pg_isready nao basta.
            for i in $(seq 1 80); do
              if docker exec "$target" pg_isready -U postgres >/dev/null 2>&1; then
                sleep 3
                if docker exec "$target" pg_isready -U postgres >/dev/null 2>&1; then
                  ready=1
                  break
                fi
              fi
              sleep 1
            done
            if [[ "$ready" != 1 ]]; then
              docker logs "$target" | tail -n 80
              exit 1
            fi
          done
      - name: Create synthetic financial schema and placeholder Vault
        shell: bash
        run: |
          docker exec -i meg-stage09-test-src psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public."User" (id text PRIMARY KEY, name text NOT NULL);
          CREATE TABLE public."AppState" (id text PRIMARY KEY, user_id text REFERENCES public."User"(id), state jsonb NOT NULL);
          CREATE TABLE public."FinancialEvent" (id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, user_id text NOT NULL REFERENCES public."User"(id), amount numeric(12,2) NOT NULL CHECK (amount > 0));
          CREATE INDEX financial_event_user_idx ON public."FinancialEvent" (user_id);
          INSERT INTO public."User" VALUES ('synthetic-user', 'SYNTHETIC');
          INSERT INTO public."AppState" VALUES ('synthetic-state', 'synthetic-user', '{"transactions":[]}');
          INSERT INTO public."FinancialEvent" (user_id, amount) VALUES ('synthetic-user', 10), ('synthetic-user', 20), ('synthetic-user', 30);
          CREATE SCHEMA vault;
          CREATE TABLE vault.secrets (id text PRIMARY KEY, secret text NOT NULL);
          INSERT INTO vault.secrets VALUES ('synthetic-vault', 'SYNTHETIC-NOT-A-REAL-KEY');
          SQL
      - name: Encrypt archive and test the REAL restore script against local Unix socket
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/meg-local-recovery"
          age-keygen -o "$RUNNER_TEMP/meg-local-recovery/key.txt"
          recipient="$(age-keygen -y "$RUNNER_TEMP/meg-local-recovery/key.txt")"
          backup="$RUNNER_TEMP/meg-local-recovery/meg-synthetic.pgdump.age"
          docker exec meg-stage09-test-src pg_dump -U postgres -Fc --no-owner --no-privileges --no-tablespaces -Z 6 -d postgres \
            | age -r "$recipient" -o "$backup"
          hash="$(sha256sum "$backup" | awk '{print $1}')"
          cat > "$RUNNER_TEMP/meg-local-recovery/meg-synthetic.manifest.txt" <<MANIFEST
          project_ref=ugbiqzaqnrhulhetevby
          archive_format=pg_dump_custom_age_encrypted
          public_table_count=3
          archive_sha256=$hash
          MANIFEST
          docker exec meg-stage09-test-dst psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE meg_restore_drill TEMPLATE template0'
          docker exec -u root meg-stage09-test-dst sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq age'
          docker exec -u root meg-stage09-test-dst mkdir -p /tmp/meg-local-recovery
          docker cp "$RUNNER_TEMP/meg-local-recovery/." meg-stage09-test-dst:/tmp/meg-local-recovery/
          docker cp scripts/meg-stage09-safe-restore-drill.sh meg-stage09-test-dst:/tmp/meg-local-recovery/meg-stage09-safe-restore-drill.sh
          docker exec -u root meg-stage09-test-dst chown -R postgres:postgres /tmp/meg-local-recovery
          docker exec -u postgres \
            -e MEG_BACKUP_FILE=/tmp/meg-local-recovery/meg-synthetic.pgdump.age \
            -e MEG_AGE_IDENTITY=/tmp/meg-local-recovery/key.txt \
            -e MEG_RESTORE_ISOLATED_OK=YES \
            meg-stage09-test-dst bash /tmp/meg-local-recovery/meg-stage09-safe-restore-drill.sh
          docker exec meg-stage09-test-dst psql -U postgres -d meg_restore_drill -Atc \
            'SELECT count(*) FROM public."FinancialEvent"' | grep -qx '3'
          docker exec meg-stage09-test-dst psql -U postgres -d meg_restore_drill -Atc \
            "SELECT count(*) FROM pg_constraint c JOIN pg_class t ON t.oid=c.conrelid JOIN pg_namespace n ON n.oid=t.relnamespace WHERE n.nspname='public' AND t.relname='FinancialEvent' AND c.contype='f'" | grep -qx '1'
          docker exec meg-stage09-test-dst psql -U postgres -d meg_restore_drill -Atc \
            "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname='financial_event_user_idx'" | grep -qx '1'
          docker exec meg-stage09-test-dst psql -U postgres -d meg_restore_drill -Atc \
            "SELECT count(*) FROM pg_sequences WHERE schemaname='public'" | grep -qx '1'
          age -d -i "$RUNNER_TEMP/meg-local-recovery/key.txt" "$backup" \
            | docker exec -i meg-stage09-test-dst pg_restore --list \
            | grep -Eq 'TABLE DATA[[:space:]]+vault[[:space:]]+secrets'
          echo 'PostgreSQL17 synthetic restore with production-script code: PASSED'
      - name: Verify real age full-stream authentication, including truncated archive
        shell: bash
        run: |
          set -Eeuo pipefail
          backup="$RUNNER_TEMP/meg-local-recovery/meg-synthetic.pgdump.age"
          identity="$RUNNER_TEMP/meg-local-recovery/key.txt"
          catalog="$RUNNER_TEMP/meg-local-recovery/verified-catalog.txt"
          age -d -i "$identity" "$backup" | {
            docker exec -i meg-stage09-test-dst pg_restore --list >"$catalog"
            list_rc=$?
            cat >/dev/null
            drain_rc=$?
            (( list_rc == 0 && drain_rc == 0 ))
          }
          grep -Eq 'TABLE DATA[[:space:]]+public[[:space:]]+FinancialEvent' "$catalog"
          size="$(wc -c < "$backup")"
          (( size > 16 ))
          head -c "$((size - 16))" "$backup" > "$RUNNER_TEMP/meg-local-recovery/meg-truncated.pgdump.age"
          if age -d -i "$identity" "$RUNNER_TEMP/meg-local-recovery/meg-truncated.pgdump.age" 2>/dev/null | {
            docker exec -i meg-stage09-test-dst pg_restore --list >/dev/null 2>/dev/null
            list_rc=$?
            cat >/dev/null
            drain_rc=$?
            (( list_rc == 0 && drain_rc == 0 ))
          }; then
            echo 'FALHA: arquivo age truncado foi aceito' >&2
            exit 1
          fi
          echo 'Real age stream: íntegro aceito; truncado recusado'
      - name: Clean disposable test containers
        if: always()
        shell: bash
        run: |
          docker rm -f meg-stage09-test-src meg-stage09-test-dst 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/meg-local-recovery"

  financial-invariants-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout no production credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start disposable PostgreSQL 17
        shell: bash
        run: |
          docker run -d --name meg-stage09-invariants-pg17 -e POSTGRES_PASSWORD=TEST_ONLY postgres:17
          for i in $(seq 1 45); do
            if docker exec meg-stage09-invariants-pg17 pg_isready -U postgres >/dev/null 2>&1; then
              sleep 3
              if docker exec meg-stage09-invariants-pg17 pg_isready -U postgres >/dev/null 2>&1; then
                exit 0
              fi
            fi
            sleep 1
          done
          echo 'PostgreSQL 17 synthetic fixture unavailable' >&2
          exit 1
      - name: Create entirely fictitious finance fixture
        shell: bash
        run: |
          docker exec -i meg-stage09-invariants-pg17 psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public."User" (id text PRIMARY KEY);
          CREATE TABLE public."AppState" (id text PRIMARY KEY);
          CREATE TABLE public."Account" (id text PRIMARY KEY, type text);
          CREATE TABLE public."PaymentMethod" (id text PRIMARY KEY, name text);
          CREATE TABLE public."FinancialEvent" (
            id text PRIMARY KEY, "workspaceId" text, "accountId" text,
            "paymentMethodId" text, "legacyTransactionId" text,
            "sourcePayload" jsonb, "archivedAt" timestamptz,
            type text NOT NULL, status text NOT NULL, date timestamptz NOT NULL,
            competence text NOT NULL, amount numeric NOT NULL, "signedAmount" numeric NOT NULL
          );
          CREATE TABLE public."LedgerEntry" (id text PRIMARY KEY, debit numeric NOT NULL, credit numeric NOT NULL);
          CREATE TABLE public."CardPurchase" (id text PRIMARY KEY, installments integer NOT NULL, "totalAmount" numeric NOT NULL);
          CREATE TABLE public."CardInstallment" (
            id text PRIMARY KEY, "purchaseId" text, number integer NOT NULL,
            amount numeric NOT NULL, "partialPaidAmount" numeric NOT NULL
          );
          CREATE TABLE public."Payable" (
            id text PRIMARY KEY, "openAmount" numeric NOT NULL, "totalAmount" numeric NOT NULL,
            "installmentNo" integer NOT NULL, "installmentQty" integer NOT NULL
          );
          CREATE TABLE public."CloudMutationReceipt" (id text PRIMARY KEY);
          INSERT INTO public."User" VALUES ('synthetic-user');
          INSERT INTO public."AppState" VALUES ('synthetic-state');
          INSERT INTO public."Account" VALUES ('a','checking'),('b','cash'),('c','benefit');
          INSERT INTO public."PaymentMethod" VALUES ('pm','VEROCARD');
          INSERT INTO public."FinancialEvent" (id,"workspaceId","accountId","paymentMethodId","legacyTransactionId","sourcePayload",type,status,date,competence,amount,"signedAmount") VALUES
          ('in','w','a',NULL,NULL,NULL,'income','paid','2026-11-01T12:00:00Z','2026-11',10,10),
          ('out','w','a',NULL,NULL,NULL,'expense','paid','2026-11-01T12:00:00Z','2026-11',4,-4),
          ('source','w','a',NULL,NULL,'{"transferId":"t-12345678","transferLeg":"source","counterpartyAccountId":"b"}','transfer','paid','2026-11-01T12:00:00Z','2026-11',3,-3),
          ('dest','w','b',NULL,NULL,'{"transferId":"t-12345678","transferLeg":"destination","counterpartyAccountId":"a"}','transfer','paid','2026-11-01T12:00:00Z','2026-11',3,3),
          ('opening','w','a',NULL,'opening-balance:a',NULL,'income','paid','2026-11-01T12:00:00Z','2026-11',2,2),
          ('benefit','w','c','pm',NULL,NULL,'income','paid','2026-11-01T12:00:00Z','2026-11',5,5);
          INSERT INTO public."LedgerEntry" VALUES ('l1',10,0),('l2',0,4);
          INSERT INTO public."CardPurchase" VALUES ('purchase',2,20);
          INSERT INTO public."CardInstallment" VALUES ('i1','purchase',1,10,2),('i2','purchase',2,10,0);
          INSERT INTO public."Payable" VALUES ('pay',25,50,1,1);
          INSERT INTO public."CloudMutationReceipt" VALUES ('receipt');
          SQL
      - name: Parse real audit SQL and detect both clean and damaged synthetic records
        shell: bash
        run: |
          set -Eeuo pipefail
          script=scripts/meg-stage09-audit-financial-invariants.sh
          bash -n "$script"
          sed -n "/<<'SQL'/,/^SQL$/p" "$script" | sed '1d;$d' > "$RUNNER_TEMP/meg-fin-invariants.sql"
          test -s "$RUNNER_TEMP/meg-fin-invariants.sql"
          if grep -Ein '^[[:space:]]*(INSERT|UPDATE|DELETE|DROP|TRUNCATE|ALTER|CREATE|GRANT|REVOKE|COPY)[[:space:]]' "$RUNNER_TEMP/meg-fin-invariants.sql"; then
            echo 'Unexpected write operation in audit SQL' >&2
            exit 1
          fi
          docker exec -i meg-stage09-invariants-pg17 psql -qAt -U postgres -d postgres -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/meg-fin-invariants.sql" > "$RUNNER_TEMP/baseline.txt"
          grep -qx 'TRANSFER_GRUPOS_MODERNOS=1' "$RUNNER_TEMP/baseline.txt"
          grep -qx 'TRANSFER_GRUPOS_SUSPEITOS=0' "$RUNNER_TEMP/baseline.txt"
          grep -qx 'CARTAO_COMPRAS_DIVERGENTES=0' "$RUNNER_TEMP/baseline.txt"
          grep -qx 'EVENTOS_DESPESA_COM_SINAL_POSITIVO=0' "$RUNNER_TEMP/baseline.txt"
          docker exec -i meg-stage09-invariants-pg17 psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public."FinancialEvent" (id,"workspaceId","accountId",type,status,date,competence,amount,"signedAmount")
          VALUES ('synthetic-bad-expense','w','a','expense','paid','2026-11-01T12:00:00Z','2026-11',5,5);
          UPDATE public."CardInstallment" SET "partialPaidAmount"=11 WHERE id='i1';
          SQL
          docker exec -i meg-stage09-invariants-pg17 psql -qAt -U postgres -d postgres -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/meg-fin-invariants.sql" > "$RUNNER_TEMP/anomalies.txt"
          grep -qx 'EVENTOS_DESPESA_COM_SINAL_POSITIVO=1' "$RUNNER_TEMP/anomalies.txt"
          grep -qx 'CARTAO_PARCELAS_PAGO_PARCIAL_INCONSISTENTE=1' "$RUNNER_TEMP/anomalies.txt"
          echo 'REAL PostgreSQL 17 synthetic financial invariant SQL: PASSED'
      - name: Remove disposable fixture
        if: always()
        shell: bash
        run: docker rm -f meg-stage09-invariants-pg17 2>/dev/null || true
