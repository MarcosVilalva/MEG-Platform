name: MEG Stage10 financial E2E PG17 isolated
on:
  push:
    branches: [stage10/android-confirmacao-qa-20261118]
    paths:
      - '.github/workflows/meg-stage10-financial-e2e-pg17.yml'
      - 'apps/api/src/modules/finance/rc1-financial-e2e.test.ts'
      - 'apps/api/src/modules/finance/event-mutation.ts'
      - 'apps/api/src/modules/finance/monetary-protection.ts'
      - 'apps/api/src/modules/finance/transfer-service.ts'
      - 'apps/api/src/modules/finance/benefit-event-mutation.ts'

permissions:
  contents: read

jobs:
  financial-e2e-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: meg_stage10_sandbox
          POSTGRES_USER: meg_stage10_ci
          POSTGRES_PASSWORD: stage10_ci_disposable_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meg_stage10_ci -d meg_stage10_sandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://meg_stage10_ci:stage10_ci_disposable_only@127.0.0.1:5432/meg_stage10_sandbox?schema=public
      NODE_ENV: test
      MEG_STAGE10_ISOLATED_PG: '1'
      MEG_STAGE10_QA_LOCAL_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Enforce disposable localhost DB before any database operation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const uri = new URL(process.env.DATABASE_URL);
          if (uri.protocol !== 'postgresql:' || uri.hostname !== '127.0.0.1' ||
              uri.port !== '5432' || uri.pathname !== '/meg_stage10_sandbox' ||
              uri.username !== 'meg_stage10_ci' ||
              process.env.MEG_STAGE10_ISOLATED_PG !== '1' ||
              process.env.MEG_STAGE10_QA_LOCAL_ONLY !== '1') {
            throw new Error('STAGE10_FINANCIAL_E2E_LOCAL_PG17_ONLY');
          }
          console.log('STAGE10_FINANCIAL_E2E_DB_ISOLATION=PASS');
          NODE
      - name: Install dependencies without publishing artifact
        run: npm ci --ignore-scripts --audit=false --fund=false
      - name: Enforce unchanged full dependency security gate
        run: node scripts/npm-security-audit.mjs --audit-level=high
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Prepare schema in ephemeral PostgreSQL 17 only
        run: npx --no-install prisma db push --schema packages/database/prisma/schema.prisma --skip-generate
      - name: Run the existing RC1 financial E2E in PG17
        run: npm --workspace apps/api run test:rc1-financial-e2e
      - name: State test boundary
        run: |
          echo 'STAGE10_RC1_FINANCIAL_E2E_PG17=PASS'
          echo 'STAGE10_PRODUCTION_DATA_REPLICA=NOT_TESTED'
          echo 'STAGE10_ANDROID_PHYSICAL=NOT_TESTED'
