name: MEG Stage09 - Home + Lancamentos API QA Isolada
on:
  push:
    branches:
      - 'integration/09-readonly-home-p0-20261111'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-both-read-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://meg_qa:meg_qa@127.0.0.1:5432/meg_home_p0_qa?schema=public
      NODE_ENV: test
      JWT_SECRET: meg-home-p0-qa-only-fictitious-jwt-secret-2026
      MEG_HOME_P0_HTTP_QA: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: meg_home_p0_qa
          POSTGRES_USER: meg_qa
          POSTGRES_PASSWORD: meg_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meg_qa -d meg_home_p0_qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias e gerar Prisma sem publicar
        run: |
          npm ci --audit=false
          npm run db:generate
      - name: Compilacao API e caracterizacao financeira
        run: |
          npm run build:api
          npm run test:finance
          npm run test:cors
          npm run test:security
      - name: Contratos Home e Lancamentos e token compartilhado
        run: |
          npx tsx apps/api/src/modules/finance/home-commitments-read.contract.test.ts
          npx tsx apps/api/src/modules/finance/workspace-sharing.contract.test.ts
          npx tsx scripts/meg-stage09-filtered-summary.contract.test.ts
          npx tsx apps/web/src/meg-web-evolution/home/home-commitments-read.contract.test.ts
          node --test scripts/meg-stage09-api-readonly-preflight.test.mjs
          MEG_API_RENDER_BUILD_COMMAND='npm ci --audit=false && npm run db:generate && npm run build:api' node scripts/meg-stage09-api-readonly-preflight.mjs
      - name: Isolar banco de QA e criar schema efemero
        run: |
          test "$DATABASE_URL" = 'postgresql://meg_qa:meg_qa@127.0.0.1:5432/meg_home_p0_qa?schema=public' || { echo "Destino DB diferente do QA efemero"; exit 1; }
          npx prisma db push --schema packages/database/prisma/schema.prisma --skip-generate
      - name: Regressao com dados sinteticos no PostgreSQL 17
        run: |
          npx tsx scripts/meg-stage09-snapshot-postgres.integration.ts
          npx tsx apps/api/src/modules/finance/home-commitments-postgres-isolated.test.ts
          npx tsx apps/api/src/modules/finance/home-commitments-http-isolated.test.ts
      - name: Construir entrada da Home sem publicar
        run: cd apps/web && npx vite build --config vite.fluxo-integrado-08.config.ts
      - name: Impedir qualquer alteracao de UI, Android, banco e writers
        run: |
          set -euo pipefail
          BASE=c85e0e4d4ad6baae73f5fee17dd3ea8a66a51a35
          git diff --name-only "$BASE" HEAD > /tmp/meg-stage09-readonly-merge.txt
          cat /tmp/meg-stage09-readonly-merge.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/meg-stage09-home-api-combined-qa.yml|docs/MEG-STAGE09-HOME-API-COMBINED-QA-20261111.md|apps/api/src/modules/finance/routes.ts|apps/api/src/modules/finance/service.ts|apps/api/src/modules/finance/history-filter.ts|apps/api/src/modules/finance/history-revision.ts|apps/api/src/modules/finance/workspace-sharing.contract.test.ts|scripts/meg-stage09-api-readonly-preflight.mjs|scripts/meg-stage09-api-readonly-preflight.test.mjs|scripts/meg-stage09-filtered-summary.contract.test.ts|scripts/meg-stage09-snapshot-postgres.integration.ts)
                ;;
              *) echo "ESCOPO PROIBIDO: $path"; exit 1;;
            esac
          done < /tmp/meg-stage09-readonly-merge.txt
