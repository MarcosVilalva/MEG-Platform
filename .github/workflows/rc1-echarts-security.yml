name: RC1 ECharts Security Upgrade

on:
  push:
    branches:
      - phoenix/v15-clean-room

permissions:
  contents: write

jobs:
  upgrade-echarts:
    if: contains(github.event.head_commit.message, 'execute echarts security upgrade')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Phoenix candidate
        uses: actions/checkout@v4
        with:
          ref: phoenix/v15-clean-room

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade ECharts outside vulnerable range
        shell: bash
        run: |
          cp package.json /tmp/root-package.json
          cp apps/api/package.json /tmp/api-package.json
          cp packages/database/package.json /tmp/database-package.json
          npm install --package-lock-only --ignore-scripts --workspace apps/web echarts@6.1.0 --save-exact
          cmp -s package.json /tmp/root-package.json
          cmp -s apps/api/package.json /tmp/api-package.json
          cmp -s packages/database/package.json /tmp/database-package.json
          node <<'NODE'
          const fs = require('node:fs');
          const web = JSON.parse(fs.readFileSync('apps/web/package.json', 'utf8'));
          if (web.dependencies?.echarts !== '6.1.0') {
            console.error('Versão final do ECharts não ficou fixada em 6.1.0.');
            process.exit(1);
          }
          NODE

      - name: Install upgraded dependency graph
        run: npm install --ignore-scripts

      - name: Generate Prisma client for complete regression
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/meg

      - name: Verify ECharts runtime import
        working-directory: apps/web
        run: node -e "import('echarts').then((m) => { if (!m.init || !m.version) process.exit(1); console.log('ECharts runtime resolvido:', m.version); })"

      - name: Run complete RC1 regression
        run: npm run check
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/meg
          NODE_ENV: test
          CORS_ORIGINS: http://localhost:5173

      - name: Verify ECharts audit blocker removed
        shell: bash
        run: |
          npm audit --json > /tmp/echarts-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/echarts-audit.json', 'utf8'));
          if (audit.vulnerabilities?.echarts) {
            console.error('Bloqueador ECharts continua presente:', audit.vulnerabilities.echarts);
            process.exit(1);
          }
          console.log('Bloqueador ECharts removido do inventário npm audit.');
          NODE

      - name: Commit verified ECharts security upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json package-lock.json
          git diff --cached --quiet && { echo 'Nenhuma alteração ECharts para gravar.'; exit 0; }
          git commit -m 'fix(rc1): upgrade ECharts security chain'
          git push origin HEAD:phoenix/v15-clean-room
