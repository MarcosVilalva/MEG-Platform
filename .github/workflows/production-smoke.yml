name: MEG Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployments
        run: sleep 60

      - name: Verify API
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail-with-body --silent --show-error --max-time 20 https://meg-platform-api.onrender.com/health -o health.json \
              && grep -q '"status":"ok"' health.json \
              && grep -q '"financialReady":true' health.json; then
              echo "API pronta e fonte financeira confirmada na tentativa $attempt."
              exit 0
            fi
            echo "API ainda inicializando a fonte financeira (tentativa $attempt/30)."
            sleep 10
          done
          echo "API não atingiu estado financeiro pronto no prazo."
          cat health.json || true
          exit 1

      - name: Verify production security hardening
        run: |
          set -euo pipefail
          API="https://meg-platform-api.onrender.com"

          curl --fail-with-body --silent --show-error --max-time 20 \
            -D health-headers.txt "$API/health" -o public-health.json

          tr -d '\r' < health-headers.txt | tr '[:upper:]' '[:lower:]' > health-headers-normalized.txt
          grep -q '^x-content-type-options: nosniff$' health-headers-normalized.txt
          grep -q '^x-frame-options: deny$' health-headers-normalized.txt
          grep -q '^referrer-policy: no-referrer$' health-headers-normalized.txt
          grep -q "^content-security-policy: default-src 'none'; frame-ancestors 'none'; base-uri 'none'$" health-headers-normalized.txt
          grep -q '^cache-control: no-store$' health-headers-normalized.txt

          grep -q '"status":"ok"' public-health.json
          grep -q '"financialReady":true' public-health.json
          if grep -Eq '"(environment|features|integrations|commit|dataRepair|normalization|providers)"' public-health.json; then
            echo "Health público voltou a expor diagnóstico interno."
            cat public-health.json
            exit 1
          fi

          curl --fail-with-body --silent --show-error --max-time 20 "$API/ready" -o public-ready.json
          grep -q '"status":"ready"' public-ready.json
          if grep -Eq '"(database|providers|environment|commit)"' public-ready.json; then
            echo "Readiness público voltou a expor diagnóstico interno."
            cat public-ready.json
            exit 1
          fi

          docs_status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$API/docs")
          test "$docs_status" = "404"

          auth_status=$(curl --silent --show-error --max-time 20 -D auth-headers.txt -o /dev/null -w '%{http_code}' "$API/auth/me")
          test "$auth_status" = "401"

          tr -d '\r' < auth-headers.txt | tr '[:upper:]' '[:lower:]' > auth-headers-normalized.txt
          grep -q '^cache-control: no-store$' auth-headers-normalized.txt

          echo "Hardening de produção confirmado: health mínimo, headers, Swagger fechado e rota autenticada protegida."

      - name: Verify published Evolution Web
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          URL="https://marcosvilalva.github.io/MEG-Platform/evolution.html?build=$BUILD_SHA"

          for attempt in $(seq 1 24); do
            if curl --fail-with-body --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "$URL" -o evolution-site.html \
              && grep -q 'data-meg-shell="evolution"' evolution-site.html \
              && grep -q '<title>MEG Evolution</title>' evolution-site.html \
              && grep -q 'http-equiv="Content-Security-Policy"' evolution-site.html \
              && grep -Eq "script-src (&#39;|'|&apos;)self(&#39;|'|&apos;)" evolution-site.html \
              && grep -Eq "object-src (&#39;|'|&apos;)none(&#39;|'|&apos;)" evolution-site.html; then
              asset=$(grep -oE 'src="[^"]+\.js"' evolution-site.html | head -1 | cut -d'"' -f2 || true)
              if [ -n "$asset" ]; then
                if [[ "$asset" == http* ]]; then
                  asset_url="$asset"
                elif [[ "$asset" == /* ]]; then
                  asset_url="https://marcosvilalva.github.io$asset"
                else
                  asset_url="https://marcosvilalva.github.io/MEG-Platform/${asset#./}"
                fi
                curl --fail-with-body --silent --show-error --max-time 20 "$asset_url" -o /dev/null
              fi
              echo "Evolution Web publicada e asset principal acessível na tentativa $attempt."
              exit 0
            fi

            echo "Evolution Web ainda propagando (tentativa $attempt/24)."
            sleep 10
          done

          echo "Evolution Web não ficou disponível no prazo."
          cat evolution-site.html || true
          exit 1

      - name: Verify official Phoenix V15 web application
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail-with-body --silent --show-error --max-time 20 https://marcosvilalva.github.io/MEG-Platform/ -o site.html \
              && grep -q 'data-meg-shell="phoenix-v15"' site.html \
              && grep -q 'MEG Finanças' site.html; then
              echo "Phoenix V15 publicada na tentativa $attempt."
              exit 0
            fi
            echo "GitHub Pages ainda propagando (tentativa $attempt/24)."
            sleep 10
          done
          echo "Phoenix V15 não ficou disponível no prazo."
          exit 1
