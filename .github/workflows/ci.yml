name: MEG Platform CI

on:
  push:
    branches:
      - main
      - phoenix/v15-clean-room
      - 'rc1/**'
      - 'sprint-*'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate API dependency manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const api = JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const declared = api.dependencies || {};
          const locked = lock.packages?.['apps/api']?.dependencies || {};
          const declaredKeys = Object.keys(declared).sort();
          const lockedKeys = Object.keys(locked).sort();
          if (JSON.stringify(declaredKeys) !== JSON.stringify(lockedKeys)) {
            console.error('apps/api/package.json e package-lock.json possuem dependências de produção diferentes.');
            console.error('package.json:', declaredKeys);
            console.error('package-lock:', lockedKeys);
            process.exit(1);
          }
          for (const name of declaredKeys) {
            if (declared[name] !== locked[name]) {
              console.error(`Versão divergente para ${name}: package.json=${declared[name]} package-lock=${locked[name]}`);
              process.exit(1);
            }
          }
          console.log('Manifesto de dependências da API consistente com o lockfile.');
          NODE

      - name: Install dependencies
        run: npm install

      - name: Enforce dependency security gate
        run: node scripts/npm-security-audit.mjs --audit-level=high

      - name: Capture RC1 dependency security inventory
        if: github.ref == 'refs/heads/phoenix/v15-clean-room' || startsWith(github.ref, 'refs/heads/rc1/')
        shell: bash
        run: |
          node scripts/npm-security-audit.mjs --json --audit-level=low > rc1-npm-audit.json || true
          node scripts/rc1-security-summary.mjs rc1-npm-audit.json > rc1-npm-audit.md
          cat rc1-npm-audit.md

      - name: Upload RC1 dependency security inventory
        if: always() && (github.ref == 'refs/heads/phoenix/v15-clean-room' || startsWith(github.ref, 'refs/heads/rc1/'))
        uses: actions/upload-artifact@v4
        with:
          name: rc1-dependency-security
          path: |
            rc1-npm-audit.json
            rc1-npm-audit.md
          if-no-files-found: error
          retention-days: 7

      - name: Generate non-breaking dependency remediation proposal
        if: github.ref == 'refs/heads/phoenix/v15-clean-room' || startsWith(github.ref, 'refs/heads/rc1/')
        shell: bash
        run: |
          npm update --package-lock-only --ignore-scripts --audit=false > rc1-audit-safe-fix.log 2>&1 || true
          cp package-lock.json rc1-package-lock-safe-fix.json
          node scripts/npm-security-audit.mjs --json --audit-level=low > rc1-npm-audit-after-safe-fix.json || true
          node scripts/rc1-security-summary.mjs rc1-npm-audit-after-safe-fix.json > rc1-npm-audit-after-safe-fix.md
          cat rc1-npm-audit-after-safe-fix.md

      - name: Upload non-breaking remediation proposal
        if: always() && (github.ref == 'refs/heads/phoenix/v15-clean-room' || startsWith(github.ref, 'refs/heads/rc1/'))
        uses: actions/upload-artifact@v4
        with:
          name: rc1-dependency-safe-fix-plan
          path: |
            rc1-package-lock-safe-fix.json
            rc1-npm-audit-after-safe-fix.json
            rc1-npm-audit-after-safe-fix.md
            rc1-audit-safe-fix.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify API runtime imports
        working-directory: apps/api
        run: node -e "Promise.all([import('@fastify/swagger'), import('@fastify/swagger-ui')]).then(() => console.log('Dependências runtime da API resolvidas.'))"

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/meg

      - name: Run tests and builds
        run: npm run check
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/meg
          NODE_ENV: test
          CORS_ORIGINS: http://localhost:5173

      - name: Upload Phoenix Web preview
        if: github.event_name == 'pull_request' && (github.head_ref == 'phoenix/v15-clean-room' || github.head_ref == 'feature/phoenix-launch-dynamic-status' || startsWith(github.head_ref, 'rc1/'))
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-web-preview
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  financial-e2e:
    if: github.ref == 'refs/heads/phoenix/v15-clean-room' || github.ref == 'refs/heads/feature/phoenix-launch-dynamic-status' || startsWith(github.ref, 'refs/heads/rc1/') || (github.event_name == 'pull_request' && (github.head_ref == 'phoenix/v15-clean-room' || github.head_ref == 'feature/phoenix-launch-dynamic-status' || startsWith(github.head_ref, 'rc1/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: meg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/meg
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Prepare ephemeral financial database
        run: npm run db:push

      - name: Run RC1 financial integrity E2E
        run: npm --workspace apps/api run test:rc1-financial-e2e

  android-rc1:
    if: github.ref == 'refs/heads/feature/phoenix-launch-dynamic-status' || startsWith(github.ref, 'refs/heads/rc1/') || (github.event_name == 'pull_request' && (github.head_ref == 'feature/phoenix-launch-dynamic-status' || startsWith(github.head_ref, 'rc1/')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: https://meg-platform-api.onrender.com
      VITE_MOBILE_APP: 'true'
      CAPACITOR_BUILD: 'true'
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/meg-release.jks
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Align RC1 version with current stable Android channel
        shell: bash
        run: |
          set -euo pipefail
          STABLE_CODE=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('apps/web/public/downloads/app-version.json','utf8')); process.stdout.write(String(x.versionCode||''))")
          STABLE_NAME=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('apps/web/public/downloads/app-version.json','utf8')); process.stdout.write(String(x.versionName||''))")
          test -n "$STABLE_CODE"
          test -n "$STABLE_NAME"
          echo "MEG_VERSION_CODE=$STABLE_CODE" >> "$GITHUB_ENV"
          echo "MEG_VERSION_NAME=${STABLE_NAME}-rc1" >> "$GITHUB_ENV"
          echo "VITE_ANDROID_VERSION_CODE=$STABLE_CODE" >> "$GITHUB_ENV"
          echo "VITE_ANDROID_VERSION_NAME=${STABLE_NAME}-rc1" >> "$GITHUB_ENV"
          echo "RC1 alinhado ao canal estável: versionCode=$STABLE_CODE versionName=${STABLE_NAME}-rc1"

      - name: Prepare permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 is not configured" && exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo "ANDROID_STORE_PASSWORD is not configured" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS is not configured" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD is not configured" && exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Validate Android update contract
        run: npm run test:app-update-release

      - name: Build mobile web application
        run: npm run build:web

      - name: Verify APK downloads are not embedded in the Android application
        run: test ! -d apps/web/dist/downloads

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Compile Android RC1 release-signed APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew clean assembleRelease

      - name: Verify Android RC1 release identity
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$AAPT"
          test -n "$APKSIGNER"

          "$AAPT" dump badging "$APK" | tee android-rc1-badging.txt
          grep -q "package: name='br.com.megfinancas.app'" android-rc1-badging.txt
          grep -q "versionCode='$MEG_VERSION_CODE'" android-rc1-badging.txt
          grep -q "versionName='$MEG_VERSION_NAME'" android-rc1-badging.txt

          "$APKSIGNER" verify --print-certs "$APK" | tee android-rc1-signature.txt
          ACTUAL_SIGNER=$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}' android-rc1-signature.txt | tr -d ':')
          EXPECTED_SIGNER=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('apps/web/public/downloads/app-version.json','utf8')); process.stdout.write(String(x.signerSha256||'').toLowerCase().replace(/:/g,''))")
          test -n "$ACTUAL_SIGNER"
          test -n "$EXPECTED_SIGNER"
          test "$ACTUAL_SIGNER" = "$EXPECTED_SIGNER"
          echo "RC1 assinado com o mesmo certificado permanente do canal Android estável."

      - name: Upload Android RC1 release-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MEG-Financas-RC1-Release-Signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
