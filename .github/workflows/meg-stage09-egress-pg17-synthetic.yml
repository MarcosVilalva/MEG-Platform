name: MEG Stage09 Egress PostgreSQL17 synthetic wire measurement

on:
  push:
    branches:
      - 'fix/stage09-egress-projection-qa-20261113'
      - 'fix/stage09-appstate-read-qa-20261114'

permissions:
  contents: read

jobs:
  pg17-egress-wire-synthetic:
    if: github.repository == 'MarcosVilalva/MEG-Platform' && (github.ref == 'refs/heads/fix/stage09-egress-projection-qa-20261113' || github.ref == 'refs/heads/fix/stage09-appstate-read-qa-20261114')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      MEG_STAGE09_SYNTHETIC_ONLY: 'YES'
      MEG_STAGE09_PG17_WIRE_PROXY: 'YES'
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5433/meg_stage09_egress_synthetic?schema=public
      CORS_ORIGINS: http://localhost:5173
    services:
      postgres17:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: meg_stage09_egress_synthetic
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d meg_stage09_egress_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Enforce disposable local-only target before any database access
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.env.CI, 'true');
          assert.equal(process.env.MEG_STAGE09_SYNTHETIC_ONLY, 'YES');
          assert.equal(process.env.MEG_STAGE09_PG17_WIRE_PROXY, 'YES');
          assert.equal(process.env.DATABASE_URL, 'postgresql://ci:ci@127.0.0.1:5433/meg_stage09_egress_synthetic?schema=public');
          console.log('STAGE09_DATABASE=EPHEMERAL_POSTGRESQL17_ONLY');
          NODE
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Create schema exclusively in disposable PostgreSQL 17
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/meg_stage09_egress_synthetic?schema=public
        run: npm run db:push
      - name: Start localhost-only PostgreSQL byte-counting proxy
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/meg-stage09-pg17-wire-proxy.mjs > "$RUNNER_TEMP/meg-stage09-pg17-wire-proxy.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/meg-stage09-pg17-wire-proxy.pid"
          ready=0
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:5434/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat "$RUNNER_TEMP/meg-stage09-pg17-wire-proxy.log"
            exit 1
          fi
      - name: Compare PostgreSQL wire bytes and financial reconciliation in synthetic database
        run: npm exec --workspace apps/api -- tsx src/modules/app-state/stage09-egress-pg17-e2e.test.ts
      - name: Check genuine Fastify JWT guard and workspace isolation in synthetic PostgreSQL 17
        env:
          JWT_SECRET: stage09-synthetic-jwt-secret-never-for-production
        run: npm exec --workspace apps/api -- tsx src/modules/app-state/stage09-get-auth-route-pg17.test.ts
      - name: Verify 3630 synthetic events under a real 512 MiB container limit
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network=host --memory=512m --memory-swap=512m --read-only --tmpfs /tmp:rw,size=64m \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/src,readonly" -w /src/apps/api \
            -e CI -e DATABASE_URL -e MEG_STAGE09_SYNTHETIC_ONLY -e MEG_STAGE09_PG17_WIRE_PROXY \
            -e MEG_STAGE09_MEMORY_LIMITED=512MB -e MEG_STAGE09_EXPECT_EVENTS=3630 \
            node:22 node --expose-gc --import tsx src/modules/app-state/stage09-egress-memory-pg17.test.ts
      - name: Benchmark SHA256 PostgreSQL server execution and buffers on synthetic scale
        run: npm exec --workspace apps/api -- tsx src/modules/app-state/stage09-egress-performance-pg17.test.ts
      - name: Diagnose 24000 synthetic events under the same 512 MiB limit
        shell: bash
        run: |
          set +e
          docker run --rm --network=host --memory=512m --memory-swap=512m --read-only --tmpfs /tmp:rw,size=64m \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/src,readonly" -w /src/apps/api \
            -e CI -e DATABASE_URL -e MEG_STAGE09_SYNTHETIC_ONLY -e MEG_STAGE09_PG17_WIRE_PROXY \
            -e MEG_STAGE09_MEMORY_LIMITED=512MB -e MEG_STAGE09_EXPECT_EVENTS=24000 \
            node:22 node --expose-gc --import tsx src/modules/app-state/stage09-egress-memory-pg17.test.ts
          outcome=$?
          echo "STAGE09_MEMORY_24000_DIAGNOSTIC_EXIT=${outcome}"
          if [ "${outcome}" -ne 0 ]; then
            echo "::warning::24k synthetic workload failed in a 512 MiB container; NOT approved for memory-constrained deployment."
          fi
          exit 0
      - name: Confirm no production or restore database was accessed
        if: always()
        shell: bash
        run: |
          echo "STAGE09_TARGET=LOCALHOST_EPHEMERAL_PG17"
          echo "STAGE09_PRODUCTION=NOT_ACCESSED"
          echo "STAGE09_WSL_RESTORE=NOT_ACCESSED"
          echo "STAGE09_VAULT=NOT_ACCESSED"
          if test -f "$RUNNER_TEMP/meg-stage09-pg17-wire-proxy.pid"; then
            kill "$(cat "$RUNNER_TEMP/meg-stage09-pg17-wire-proxy.pid")" 2>/dev/null || true
          fi
