name: MEG WhatsApp Reconnect Diagnostic

on:
  push:
    branches:
      - ops/whatsapp-reconnect-test-20260924

jobs:
  whatsapp-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake MEG API
        env:
          API_URL: ${{ vars.VITE_API_URL || 'https://meg-platform-api.onrender.com' }}
        run: |
          curl --silent --show-error --fail --max-time 90 "$API_URL/ready" | jq .

      - name: Send controlled messaging diagnostic
        env:
          API_URL: ${{ vars.VITE_API_URL || 'https://meg-platform-api.onrender.com' }}
          CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "NOTIFICATION_CRON_SECRET is not configured"; exit 1; }
          RESPONSE=$(curl --silent --show-error --fail-with-body --max-time 180             -X POST "$API_URL/notifications/cron"             -H "x-cron-secret: $CRON_SECRET"             -H "Content-Type: application/json"             --data '{"slot":"06:00","force":true}')
          echo "$RESPONSE" | jq .
          WA_SENT=$(echo "$RESPONSE" | jq '[.. | objects | select(((.channel? // "") | startswith("whatsapp:")) and (.status? == "sent"))] | length')
          WA_FAILED=$(echo "$RESPONSE" | jq '[.. | objects | select(((.channel? // "") | startswith("whatsapp:")) and (.status? == "failed"))] | length')
          echo "WhatsApp sent=$WA_SENT failed=$WA_FAILED"
          test "$WA_SENT" -gt 0 || { echo "No WhatsApp delivery was accepted by the provider"; exit 1; }
          test "$WA_FAILED" -eq 0 || { echo "At least one WhatsApp delivery failed"; exit 1; }
