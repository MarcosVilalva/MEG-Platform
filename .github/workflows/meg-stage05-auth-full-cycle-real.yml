name: MEG Stage05 Full Auth Cycle Real API Homologation
on:
  push:
    branches:
      - tmp/stage05-auth-cycle-audit
permissions:
  contents: read
jobs:
  test-real-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: meg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/meg
      NODE_ENV: test
      PORT: '3333'
      HOST: 127.0.0.1
      LOG_LEVEL: error
      CORS_ORIGINS: http://127.0.0.1:4173
      ADMIN_EMAIL: admin-fixture@example.test
      BREVO_API_KEY: isolated-brevo-fixture-not-a-real-key
      BREVO_SENDER_EMAIL: no-reply@fixture.example.test
      RUN_LEGACY_REPAIR: 'false'
      VITE_API_URL: http://127.0.0.1:3333
      VITE_PUBLIC_BASE_PATH: /
      PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Read isolated scripts
        uses: actions/checkout@v4
        with:
          path: harness
      - name: Checkout exact PR644 audited source
        uses: actions/checkout@v4
        with:
          ref: d821dffde424f3f2720b7459e6edfbf7a4fa3bf1
          path: source
      - name: Verify SHA and environment before any database command
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git -C source rev-parse HEAD)
          test "$ACTUAL" = 'd821dffde424f3f2720b7459e6edfbf7a4fa3bf1'
          test "$DATABASE_URL" = 'postgresql://ci:ci@127.0.0.1:5432/meg'
          test "$NODE_ENV" = test
          test "$BREVO_API_KEY" = 'isolated-brevo-fixture-not-a-real-key'
          echo "TESTED_FULL_CYCLE_SHA=$ACTUAL"
          echo "ISOLATED_RUNNER_SHA=$GITHUB_SHA"
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked dependencies
        working-directory: source
        run: npm ci --audit=false
      - name: Install pinned Playwright without changing lockfile
        working-directory: source
        run: npm install --no-save --package-lock=false --audit=false @playwright/test@1.64.0
      - name: Generate short-lived secrets in runner (masked)
        shell: bash
        run: |
          set -euo pipefail
          PASS=$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")
          JWT=$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))")
          CAPTURE=$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")
          echo "::add-mask::$PASS"
          echo "::add-mask::$JWT"
          echo "::add-mask::$CAPTURE"
          printf 'MEG_TEST_PASSWORD=%s\n' "$PASS" >> "$GITHUB_ENV"
          printf 'JWT_SECRET=%s\n' "$JWT" >> "$GITHUB_ENV"
          printf 'MEG_CAPTURE_KEY=%s\n' "$CAPTURE" >> "$GITHUB_ENV"
          echo "CREDENTIAL_GENERATION=MASKED_EPHEMERAL_ONLY"
      - name: Prepare disposable PostgreSQL and synthetic workspace
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:push
          cp ../harness/scripts/pr644-ephemeral-auth-seed.mjs scripts/pr644-test-seed.mjs
          node scripts/pr644-test-seed.mjs
      - name: Run actual API with in-memory test-only email transport and Chromium
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cp ../harness/scripts/pr644-test-only-email-capture.mjs scripts/pr644-test-only-email-capture.mjs
          cp ../harness/scripts/pr644-real-api-recovery.playwright.spec.mjs apps/web/src/meg-web-evolution/auth/pr644-real-api.playwright.spec.mjs
          cp ../harness/scripts/stage05-auth-cycle-real-api.playwright.spec.mjs apps/web/src/meg-web-evolution/auth/cycle.real-api.playwright.spec.mjs
          node --import ./scripts/pr644-test-only-email-capture.mjs --import tsx ./apps/api/src/server.ts > /tmp/meg-pr644-isolated-api.log 2>&1 &
          api_pid=$!
          vite_pid=''
          trap 'kill "$api_pid" 2>/dev/null || true; if [ -n "$vite_pid" ]; then kill "$vite_pid" 2>/dev/null || true; fi' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3333/ready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3333/ready >/dev/null
          npm --workspace apps/web run dev -- --host 127.0.0.1 --port 4173 > /tmp/meg-pr644-isolated-vite.log 2>&1 &
          vite_pid=$!
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/web-evolution.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/web-evolution.html >/dev/null
          set +e
          npx playwright test apps/web/src/meg-web-evolution/auth/cycle.real-api.playwright.spec.mjs --workers=1 --reporter=line
          first_status=$?
          npx playwright test apps/web/src/meg-web-evolution/auth/pr644-real-api.playwright.spec.mjs --workers=1 --reporter=line
          second_status=$?
          set -e
          echo "REAL_REGISTER_LOGIN_LOGOUT=$first_status"
          echo "REAL_RECOVERY=$second_status"
          if [ "$first_status" -ne 0 ] || [ "$second_status" -ne 0 ]; then exit 1; fi
      - name: Upload only sanitized visual evidence (no test logs or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meg-stage05-full-cycle-real-api
          path: |
            source/artifacts/meg-pr644-real-recovery
            source/artifacts/stage05-cycle
          if-no-files-found: warn
          retention-days: 7
