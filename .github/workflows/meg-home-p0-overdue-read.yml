name: MEG Home P0 - Leitura Financeira Isolada
on:
  push:
    branches:
      - 'audit/08-home-p0-overdue-read-20261110'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-home-commitments:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias do repositório
        run: npm ci --audit=false
      - name: Gerar cliente Prisma sem acessar banco de dados
        run: npm run db:generate
      - name: Compilar API sem deploy
        run: npm --workspace apps/api run build
      - name: Testar read model P0 e política financeira existente
        run: |
          npx tsx apps/api/src/modules/finance/home-commitments-read.contract.test.ts
          npx tsx apps/api/src/modules/finance/financial-policy.test.ts
          npx tsx apps/api/src/modules/finance/web-financial-authority.contract.test.ts
          npx tsx apps/api/src/modules/payables/routes.contract.test.ts
          npx tsx apps/api/src/modules/finance/workspace-sharing.contract.test.ts
      - name: Regressão financeira completa da API
        run: npm --workspace apps/api run test:finance
      - name: Gate de isolamento (base Home aprovada)
        run: |
          set -euo pipefail
          BASE=7298b59f40cf91df9d5744607fd01f3bcef97ca0
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD > /tmp/meg-p0-files.txt
          cat /tmp/meg-p0-files.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/meg-home-p0-overdue-read.yml|apps/api/src/modules/finance/home-commitments-core.ts|apps/api/src/modules/finance/home-commitments-read.ts|apps/api/src/modules/finance/home-commitments-read.contract.test.ts|apps/api/src/modules/finance/routes.ts|docs/MEG-WEB-HOME-OVERDUE-READ-CONTRACT-20261110.md|MEG-WEB-CONTINUIDADE-OFICIAL.md)
                ;;
              *)
                echo "ERRO: arquivo fora do escopo P0: $path" >&2
                exit 1
                ;;
            esac
          done < /tmp/meg-p0-files.txt
          echo "Escopo P0 isolado. Sem writers, schema, migrations, Android ou deploy."
