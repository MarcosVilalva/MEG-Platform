name: MEG Stage10 - Caracterizacao isolada sem writes
on:
  push:
    branches:
      - 'stage10/new-edit-launch-20261112'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caracterizacao:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
    steps:
      - name: Checkout somente da branch da Etapa 10
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias locais sem banco remoto
        run: npm ci --audit=false
      - name: Caracterizacao financeira existente e Etapa 10
        run: |
          npx tsx scripts/meg-stage09-card-nextstage-characterization.test.ts
          npx tsx scripts/meg-stage10-write-contract-characterization.test.ts
      - name: Preservar Shell, Home e DataGrid homologados
        run: |
          set -euo pipefail
          BASE=760b7ad0e3217dbab70ea426df9cad67318f79ef
          git diff --name-only "$BASE" HEAD | tee /tmp/stage10-changed.txt
          while IFS= read -r path; do
            case "$path" in
              docs/MEG-WEB-STAGE10-*|scripts/meg-stage10-*.test.ts|scripts/meg-stage10-*.browser.mjs|.github/workflows/meg-stage10-*.yml|apps/web/src/meg-web-evolution/launches/stage10/*|apps/web/src/meg-web-evolution/integrated-preview/preview.tsx|MEG-WEB-CONTINUIDADE-OFICIAL.md)
                ;;
              *)
                echo "FORA DO ESCOPO DA ETAPA 10: $path"
                exit 1
                ;;
            esac
          done < /tmp/stage10-changed.txt
          for path in \
            apps/web/src/meg-web-evolution/home/HomeDashboard.tsx \
            apps/web/src/meg-web-evolution/launches/LaunchesStage09.tsx \
            apps/web/src/meg-web-evolution/launches/LaunchTypePicker.tsx \
            apps/web/src/meg-web-evolution/shell/AppShell.tsx \
            apps/web/src/meg-web-evolution/shell/shell.css \
            apps/web/src/meg-web-evolution/datagrid/DataGrid.tsx; do
            test "$(git rev-parse "$BASE:$path")" = "$(git rev-parse "HEAD:$path")" || {
              echo "ARQUIVO HOMOLOGADO MODIFICADO: $path"; exit 1;
            }
          done
      - name: Build isolado da prévia (não executa TypeScript global da Home)
        run: |
          cd apps/web
          npx vite build --config vite.fluxo-integrado-08.config.ts
      - name: Instalar Playwright local sem lockfile
        run: npm install --no-save --package-lock=false --audit=false @playwright/test@1.64.0
      - name: QA do Novo/Editar em nove resoluções e nenhuma escrita
        env:
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory apps/web/dist-fluxo-integrado-08 >/tmp/meg-stage10-preview.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:4173/fluxo-integrado-08.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/meg-stage10-preview.browser.mjs
      - name: Evidências de responsividade Stage10
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meg-stage10-preview-visual
          path: artifacts/meg-stage10-visual/
          if-no-files-found: warn
          retention-days: 10
      - name: Builds da Web e API sem banco remoto
        run: |
          npm run db:generate
          npm run build:web
          npm run build:api
