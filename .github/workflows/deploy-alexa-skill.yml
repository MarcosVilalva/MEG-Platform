name: Deploy MEG Alexa Skill to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'integrations/alexa-skill/**'
      - 'apps/api/src/config.ts'
      - 'apps/api/src/modules/notifications/alexa-auth.ts'
      - 'apps/api/src/modules/notifications/routes.ts'
      - '.github/workflows/deploy-alexa-skill.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: meg-alexa-skill-production
  cancel-in-progress: false

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::807804823736:role/MEG-GitHub-AlexaDeploy
      LAMBDA_FUNCTION: meg-financas-alexa-skill
      LAMBDA_EXECUTION_ROLE_ARN: arn:aws:iam::807804823736:role/MEG-AlexaLambdaExecution
      MEG_API_URL: ${{ vars.VITE_API_URL || 'https://meg-platform-api.onrender.com' }}
      NOTIFICATION_CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
      ALEXA_SKILL_ID: amzn1.ask.skill.d974a851-169c-43ea-b30a-a130bdf6c452

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOTIFICATION_CRON_SECRET" || { echo "NOTIFICATION_CRON_SECRET não está configurado no GitHub Actions."; exit 1; }
          [[ "$ALEXA_SKILL_ID" == amzn1.ask.skill.* ]] || { echo "Skill ID Alexa inválido."; exit 1; }
          [[ "$AWS_ROLE_ARN" == arn:aws:iam::*:role/MEG-GitHub-AlexaDeploy ]] || { echo "Role OIDC inesperada."; exit 1; }
          [[ "$LAMBDA_EXECUTION_ROLE_ARN" == arn:aws:iam::*:role/MEG-AlexaLambdaExecution ]] || { echo "Role da Lambda inesperada."; exit 1; }

      - name: Derive isolated Alexa API credential
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_SECRET=$(node - <<'NODE'
          const { createHmac } = require('node:crypto');
          const base = String(process.env.NOTIFICATION_CRON_SECRET || '').trim();
          if (!base) process.exit(2);
          process.stdout.write(createHmac('sha256', base).update('meg-alexa-skill-v1').digest('hex'));
          NODE
          )
          test ${#DERIVED_SECRET} -eq 64
          echo "::add-mask::$DERIVED_SECRET"
          echo "MEG_ALEXA_SKILL_SECRET=$DERIVED_SECRET" >> "$GITHUB_ENV"
          echo "Credencial exclusiva da Alexa derivada sem expor o segredo de cron." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: meg-alexa-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/alexa-skill/package-lock.json

      - name: Package Alexa Lambda
        working-directory: integrations/alexa-skill
        run: |
          npm ci --omit=dev
          zip -qr "$GITHUB_WORKSPACE/meg-alexa-skill.zip" index.js package.json package-lock.json node_modules
          test -s "$GITHUB_WORKSPACE/meg-alexa-skill.zip"

      - name: Create or update Lambda code
        id: lambda
        shell: bash
        run: |
          set -euo pipefail
          if aws lambda get-function --function-name "$LAMBDA_FUNCTION" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION" \
              --zip-file fileb://meg-alexa-skill.zip \
              >/tmp/lambda-code.json
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"
          else
            aws lambda create-function \
              --function-name "$LAMBDA_FUNCTION" \
              --runtime nodejs22.x \
              --handler index.handler \
              --role "$LAMBDA_EXECUTION_ROLE_ARN" \
              --zip-file fileb://meg-alexa-skill.zip \
              --timeout 15 \
              --memory-size 256 \
              >/tmp/lambda-code.json
            aws lambda wait function-active --function-name "$LAMBDA_FUNCTION"
          fi
          ARN=$(aws lambda get-function --function-name "$LAMBDA_FUNCTION" --query 'Configuration.FunctionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "Lambda: $ARN" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Lambda environment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('/tmp/meg-lambda-env.json', JSON.stringify({
            Variables: {
              MEG_API_URL: process.env.MEG_API_URL,
              MEG_ALEXA_SKILL_SECRET: process.env.MEG_ALEXA_SKILL_SECRET,
              MEG_ALEXA_SKILL_ID: process.env.ALEXA_SKILL_ID,
            },
          }));
          NODE
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --runtime nodejs22.x \
            --handler index.handler \
            --timeout 15 \
            --memory-size 256 \
            --environment file:///tmp/meg-lambda-env.json \
            >/tmp/lambda-config.json
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"
          rm -f /tmp/meg-lambda-env.json

      - name: Configure Alexa Skills Kit trigger
        shell: bash
        run: |
          set -euo pipefail
          aws lambda remove-permission \
            --function-name "$LAMBDA_FUNCTION" \
            --statement-id meg-alexa-skills-kit \
            >/dev/null 2>&1 || true
          aws lambda add-permission \
            --function-name "$LAMBDA_FUNCTION" \
            --statement-id meg-alexa-skills-kit \
            --action lambda:InvokeFunction \
            --principal alexa-appkit.amazon.com \
            --event-source-token "$ALEXA_SKILL_ID" \
            >/tmp/alexa-permission.json

      - name: Wait for production API containing Alexa auth and validate credential
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED_API_COMMIT=$(git log -1 --format=%H -- \
            apps/api/src/config.ts \
            apps/api/src/modules/notifications/alexa-auth.ts \
            apps/api/src/modules/notifications/routes.ts)
          test -n "$REQUIRED_API_COMMIT" || { echo "Não foi possível identificar a revisão mínima da API."; exit 1; }
          API_READY=false

          for attempt in {1..40}; do
            HEALTH_CODE=$(curl --silent --show-error --max-time 30 \
              -o /tmp/meg-health.json -w '%{http_code}' "$MEG_API_URL/health" || true)
            DEPLOYED_COMMIT=$(jq -r '.commit // empty' /tmp/meg-health.json 2>/dev/null || true)

            if [ "$HEALTH_CODE" != "200" ] || [ -z "$DEPLOYED_COMMIT" ]; then
              echo "API ainda indisponível ou sem revisão identificável, HTTP ${HEALTH_CODE:-000} (tentativa $attempt/40)."
              sleep 15
              continue
            fi

            if ! git cat-file -e "${DEPLOYED_COMMIT}^{commit}" 2>/dev/null; then
              git fetch --quiet origin "$DEPLOYED_COMMIT" --depth=50 || true
            fi

            if ! git merge-base --is-ancestor "$REQUIRED_API_COMMIT" "$DEPLOYED_COMMIT" 2>/dev/null; then
              echo "Render em ${DEPLOYED_COMMIT:0:12}; ainda não contém auth Alexa ${REQUIRED_API_COMMIT:0:12} (tentativa $attempt/40)."
              sleep 15
              continue
            fi

            CRON_STATUS=$(curl --silent --show-error --max-time 30 \
              -o /tmp/cron-auth-check.json -w '%{http_code}' \
              -X POST "$MEG_API_URL/notifications/cron" \
              -H "x-cron-secret: $NOTIFICATION_CRON_SECRET" \
              -H 'Content-Type: application/json' \
              --data '{"slot":"00:01","force":false}' || true)

            if [ "$CRON_STATUS" != "200" ]; then
              CRON_ERROR=$(jq -r '.error // "sem-codigo"' /tmp/cron-auth-check.json 2>/dev/null || echo sem-codigo)
              echo "A API contém a revisão correta, mas o secret de cron não coincide: HTTP $CRON_STATUS, $CRON_ERROR."
              exit 1
            fi

            ALEXA_STATUS=$(curl --silent --show-error --max-time 30 \
              -o /tmp/alexa-auth-check.json -w '%{http_code}' \
              -X POST "$MEG_API_URL/notifications/alexa/skill" \
              -H "x-alexa-skill-secret: $MEG_ALEXA_SKILL_SECRET" \
              -H 'Content-Type: application/json' \
              --data '{"intent":"overview","query":{}}' || true)

            if [ "$ALEXA_STATUS" = "200" ] && jq -e '.speech and .cardTitle' /tmp/alexa-auth-check.json >/dev/null 2>&1; then
              API_READY=true
              echo "API ${DEPLOYED_COMMIT:0:12} contém auth Alexa ${REQUIRED_API_COMMIT:0:12} e aceitou a credencial derivada." >> "$GITHUB_STEP_SUMMARY"
              break
            fi

            ALEXA_ERROR=$(jq -r '.error // "resposta-invalida"' /tmp/alexa-auth-check.json 2>/dev/null || echo resposta-invalida)
            echo "API correta, autenticação/consulta Alexa ainda não pronta: HTTP $ALEXA_STATUS, $ALEXA_ERROR (tentativa $attempt/40)."
            sleep 15
          done

          [ "$API_READY" = true ] || {
            echo "A revisão necessária da API ou a autenticação Alexa não ficou pronta dentro da janela de 10 minutos."
            exit 1
          }

      - name: Invoke Lambda smoke test: financial intent against production API
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat >/tmp/alexa-smoke.json <<JSON
          {
            "version": "1.0",
            "session": {
              "new": false,
              "sessionId": "meg-ci-${GITHUB_RUN_ID}",
              "application": { "applicationId": "$ALEXA_SKILL_ID" },
              "attributes": {},
              "user": { "userId": "meg-ci" }
            },
            "context": {
              "System": {
                "application": { "applicationId": "$ALEXA_SKILL_ID" },
                "user": { "userId": "meg-ci" },
                "device": { "deviceId": "meg-ci", "supportedInterfaces": {} },
                "apiEndpoint": "https://api.amazonalexa.com"
              }
            },
            "request": {
              "type": "IntentRequest",
              "requestId": "meg-ci-${GITHUB_RUN_ID}",
              "timestamp": "$NOW",
              "locale": "pt-BR",
              "intent": {
                "name": "FinancialOverviewIntent",
                "confirmationStatus": "NONE",
                "slots": {}
              }
            }
          }
          JSON

          aws lambda invoke \
            --function-name "$LAMBDA_FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --payload fileb:///tmp/alexa-smoke.json \
            /tmp/alexa-response.json \
            >/tmp/alexa-invoke.json

          test -z "$(jq -r '.FunctionError // empty' /tmp/alexa-invoke.json)" || {
            echo "A Lambda retornou FunctionError.";
            exit 1;
          }
          jq -e '.response.outputSpeech.type and (.response.shouldEndSession == false)' /tmp/alexa-response.json >/dev/null
          jq -e '.response.card.title and .response.card.content' /tmp/alexa-response.json >/dev/null
          echo "Lambda respondeu ao FinancialOverviewIntent, consultou a API e manteve a sessão aberta." >> "$GITHUB_STEP_SUMMARY"
