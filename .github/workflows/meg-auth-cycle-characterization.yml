name: MEG Stage05 Full Auth Cycle Characterization
on:
  push:
    branches:
      - tmp/stage05-auth-cycle-audit
permissions:
  contents: read
jobs:
  full-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      VITE_API_URL: http://127.0.0.1:4173/api
      VITE_PUBLIC_BASE_PATH: /
      PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: tmp/stage05-auth-cycle-audit
          path: source
      - name: Verify exact audited code SHA
        run: |
          set -euo pipefail
          SHA=$(git -C source rev-parse HEAD)
          test "$SHA" = "$GITHUB_SHA"
          echo "TESTED_CODE_SHA=$SHA"
          echo "HARNESS_SHA=$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked project dependencies
        working-directory: source
        run: npm ci --audit=false
      - name: Install pinned Playwright without modifying lockfile
        working-directory: source
        run: npm install --no-save --package-lock=false --audit=false @playwright/test@1.64.0
      - name: Generate Prisma client before all contract checks
        working-directory: source
        run: npm run db:generate
      - name: Run existing project type checks, tests and builds
        working-directory: source
        run: npm run check
      - name: Start Vite, run all characterization tests, collect failures
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cp ../harness/scripts/stage05-auth-cycle-characterization.playwright.spec.mjs apps/web/src/meg-web-evolution/auth/cycle.characterization.playwright.spec.mjs
          npm --workspace apps/web run dev -- --host 127.0.0.1 --port 4173 > /tmp/cycle-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/web-evolution.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/web-evolution.html >/dev/null
          npx playwright test apps/web/src/meg-web-evolution/auth/cycle.characterization.playwright.spec.mjs apps/web/src/meg-web-evolution/auth/loading.auth-flow.playwright.spec.mjs apps/web/src/meg-web-evolution/auth/loading.focus-preview.playwright.spec.mjs --workers=1 --reporter=line
      - name: Evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meg-auth-cycle-characterization
          path: |
            source/test-results
            source/artifacts/stage05-cycle
          if-no-files-found: warn
          retention-days: 7
