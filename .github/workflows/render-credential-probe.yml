name: Render credential probe

on:
  push:
    branches:
      - fix/render-deploy-automation
    paths:
      - '.github/workflows/render-credential-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
      RENDER_SERVICE_ID_SECRET: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_SERVICE_ID_VAR: ${{ vars.RENDER_SERVICE_ID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          present() {
            if [ -n "$2" ]; then
              echo "$1=present"
            else
              echo "$1=absent"
            fi
          }
          present RENDER_DEPLOY_HOOK_URL "$RENDER_DEPLOY_HOOK_URL"
          present RENDER_DEPLOY_HOOK "$RENDER_DEPLOY_HOOK"
          present RENDER_API_KEY "$RENDER_API_KEY"
          present RENDER_API_TOKEN "$RENDER_API_TOKEN"
          present RENDER_SERVICE_ID_SECRET "$RENDER_SERVICE_ID_SECRET"
          present RENDER_SERVICE_ID_VAR "$RENDER_SERVICE_ID_VAR"
