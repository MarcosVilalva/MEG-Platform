name: MEG Alexa Due Reminders

on:
  schedule:
    # America/Sao_Paulo (UTC-3). Minutos deslocados do topo da hora.
    # O watchdog do workflow de disponibilidade cobre atrasos e tentativas perdidas.
    - cron: '21 9 * * 1-5'
    - cron: '7 21 * * 1-5'
    - cron: '7 0 * * 2-6'
    - cron: '7 15 * * 0,6'
  workflow_dispatch:
    inputs:
      mode:
        description: Tipo de anúncio
        required: true
        default: 'next-due-preview'
        type: choice
        options: ['next-due-preview', 'scheduled']
      slot:
        description: Horário lógico de São Paulo
        required: true
        default: '06:20'
        type: choice
        options: ['06:20', '18:00', '21:00', '12:00']

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API and wait until healthy
        env:
          API_URL: ${{ vars.VITE_API_URL || 'https://meg-platform-api.onrender.com' }}
        run: |
          for attempt in {1..3}; do
            if curl --silent --show-error --max-time 85 --fail "$API_URL/ready" > /tmp/meg-health.json; then
              cat /tmp/meg-health.json
              exit 0
            fi
            echo "API or provider is still waking up (attempt $attempt/3)"
            sleep 10
          done
          exit 1
      - name: Announce due bills on Alexa
        env:
          API_URL: ${{ vars.VITE_API_URL || 'https://meg-platform-api.onrender.com' }}
          CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
          MANUAL_SLOT: ${{ inputs.slot }}
          MANUAL_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test -n "$CRON_SECRET" || { echo "NOTIFICATION_CRON_SECRET is not configured"; exit 1; }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RESPONSE=$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 10 --max-time 120 \
              -X POST "$API_URL/notifications/alexa/cron" \
              -H "x-cron-secret: $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data "{\"slot\":\"$MANUAL_SLOT\",\"mode\":\"$MANUAL_MODE\",\"force\":true}")
            echo "$RESPONSE" | jq .
            STATUS=$(echo "$RESPONSE" | jq -r '.result.status // "unknown"')
            case "$STATUS" in sent|already-sent|no-due-items|skipped) exit 0 ;; *) echo "Alexa announcement status: $STATUS"; exit 1 ;; esac
          else
            echo "Scheduled Alexa pulse: watchdog uses the real São Paulo clock and refuses future-slot markers"
            RESPONSE=$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 10 --max-time 150 \
              -X POST "$API_URL/notifications/watchdog" \
              -H "x-cron-secret: $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"force":false}')
            echo "$RESPONSE" | jq .
            FAILED=$(echo "$RESPONSE" | jq -r '.failed // 0')
            test "$FAILED" -eq 0 || { echo "$FAILED watchdog cycle(s) failed"; exit 1; }
          fi
