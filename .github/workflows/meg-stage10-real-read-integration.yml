name: MEG | Stage10 leitura real opt-in (sem deploy)
on:
  push:
    branches:
      - 'stage10/real-data-read-integration-20261114'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-read-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: meg_test
          POSTGRES_PASSWORD: meg_test
          POSTGRES_DB: meg_stage10_test
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U meg_test -d meg_stage10_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install immutable dependencies
        run: npm ci --audit=false
      - name: Fail closed / no fallback / no writers
        run: |
          node --check scripts/meg-stage10-real-read-browser.synthetic.mjs
          node scripts/meg-stage10-real-data-read.contract.test.mjs
      - name: Generate Prisma client without database access
        run: npm run db:generate
      - name: Typecheck API read-only route
        run: npm --workspace apps/api run build
      - name: HTTP JWT and READ ONLY PostgreSQL 17 synthetic integration
        env:
          DATABASE_URL: postgresql://meg_test:meg_test@127.0.0.1:5439/meg_stage10_test?schema=public
          MEG_STAGE10_SYNTHETIC_DB: 'true'
          JWT_SECRET: stage10-synthetic-ci-only-jwt-secret-value-not-production
          NODE_ENV: test
        run: |
          npm --workspace packages/database run db:push
          npx tsx apps/api/src/modules/finance/stage10-readonly-http.pg.test.ts
      - name: Typecheck Web integration
        run: npx tsc -p apps/web/tsconfig.json --noEmit
      - name: Install isolated Playwright
        run: |
          set -euo pipefail
          PLAYWRIGHT_DIR="${RUNNER_TEMP}/meg-stage10-playwright"
          mkdir -p "$PLAYWRIGHT_DIR" node_modules/@playwright
          npm install --prefix "$PLAYWRIGHT_DIR" --no-save --package-lock=false --audit=false @playwright/test@1.64.0
          ln -s "$PLAYWRIGHT_DIR/node_modules/@playwright/test" node_modules/@playwright/test
      - name: Build isolated synthetic authenticated preview (never deploy)
        env:
          VITE_MEG_STAGE10_REAL_READ_ENABLED: 'true'
          VITE_API_URL: https://qa-api.example.invalid
        run: cd apps/web && NODE_ENV=production npx vite build --config vite.stage08-funcional-qa.config.ts
      - name: Synthetic authenticated browser, without real credentials or external API
        run: |
          set -euo pipefail
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /tmp/meg-stage10-browser.key \
            -out /tmp/meg-stage10-browser.crt -subj "/CN=127.0.0.1" >/dev/null 2>&1
          python3 scripts/meg-stage10-synthetic-https.py >/tmp/meg-stage10-browser-synthetic.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -kfsS https://127.0.0.1:4175/meg-unificado-qa.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/meg-stage10-real-read-browser.synthetic.mjs
      - name: Build existing unified QA, live gate disabled
        run: cd apps/web && NODE_ENV=production npx vite build --config vite.stage08-funcional-qa.config.ts
      - name: Browser gate and no credentials
        run: |
          set -euo pipefail
          python3 -m http.server 4175 --directory apps/web/dist-stage08-funcional-qa >/tmp/meg-stage10-read-static.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/meg-unificado-qa.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/meg-stage10-real-read-gate.browser.mjs
          node scripts/meg-stage08-unified-qa.browser.mjs
