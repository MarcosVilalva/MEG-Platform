name: MEG API Etapa 09 - testes pontuais CORS (nao substituem security gate)
on:
  push:
    branches:
      - 'fix/stage09-preview-cors-readonly-20261105'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  cors-stage09:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar sem executar alteracoes de dependencias
        run: npm ci --audit=false
      - name: Gerar cliente Prisma
        run: npm run db:generate
      - name: Testar CORS, preflight e bloqueio de writers da origem exata
        run: npm run test:cors
      - name: Compilar API
        run: npm run build:api
      - name: Testes de caracterizacao financeira existentes
        run: npm run test:finance
  zod4-compat-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar base original
        run: npm ci --audit=false
      - name: Simular Zod 4.6.7 sem commitar alteracoes
        run: |
          npm install zod@4.6.7 --workspace apps/api --workspace apps/web --save-exact --ignore-scripts --audit=false
          npm ls zod --all
          git diff --stat -- package.json package-lock.json apps/api/package.json apps/web/package.json
      - name: Gerar Prisma
        run: npm run db:generate
      - name: Security gate completo na arvore simulada
        run: node scripts/npm-security-audit.mjs --audit-level=high
      - name: TypeScript API
        run: npm run build:api
      - name: Testes CORS e seguranca
        run: npm run test:cors && npm run test:security
      - name: Testes financeiros de caracterizacao
        run: npm run test:finance
      - name: Build web
        run: npm run build:web
      - name: Capturar lockfile e manifests candidatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage09-zod4-compat-dry-run
          path: |
            package-lock.json
            apps/api/package.json
            apps/web/package.json
          retention-days: 5
