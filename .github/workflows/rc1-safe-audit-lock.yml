name: RC1 Safe Dependency Lock Refresh

on:
  push:
    branches:
      - phoenix/v15-clean-room

permissions:
  contents: write

jobs:
  refresh-lock:
    if: contains(github.event.head_commit.message, 'refresh safe dependency lock')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Phoenix candidate
        uses: actions/checkout@v4
        with:
          ref: phoenix/v15-clean-room

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply only non-breaking npm audit lock fixes
        shell: bash
        run: |
          cp package.json /tmp/root-package.json
          cp apps/api/package.json /tmp/api-package.json
          cp apps/web/package.json /tmp/web-package.json
          cp packages/database/package.json /tmp/database-package.json
          npm audit fix --package-lock-only --ignore-scripts || true
          cmp -s package.json /tmp/root-package.json
          cmp -s apps/api/package.json /tmp/api-package.json
          cmp -s apps/web/package.json /tmp/web-package.json
          cmp -s packages/database/package.json /tmp/database-package.json

      - name: Commit safe lock refresh
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Nenhuma alteração segura de lockfile disponível.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(rc1): apply non-breaking dependency security fixes'
          git push origin HEAD:phoenix/v15-clean-room
