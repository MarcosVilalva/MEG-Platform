name: MEG Stage08 - QA funcional isolada PR677
on:
  push:
    branches:
      - 'stage08/home-launches-closeout-20261112'
      - 'stage08/lancamentos-icons-refinement-20261112'
      - 'stage08/prism-typography-system-pilot-20261112'
      - 'stage08/prism-ui-rollout-and-flow-fix-20261112'
      - 'stage08/overdue-prism-warning-20261112'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage08-static-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NODE_ENV: test
      PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências imutáveis
        run: npm ci --audit=false
      - name: Compilar QA isolada
        run: cd apps/web && NODE_ENV=production npx vite build --config vite.stage08-funcional-qa.config.ts
      - name: Instalar Playwright de teste
        run: npm install --no-save --package-lock=false --audit=false @playwright/test@1.64.0
      - name: Exercitar aplicativo autenticado com mocks e zero rede financeira
        run: |
          set -euo pipefail
          python3 -m http.server 4175 --directory apps/web/dist-stage08-funcional-qa >/tmp/stage08-qa-static.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/stage08-funcional-qa.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/meg-stage08-static-qa.browser.mjs
          node scripts/meg-stage08-lancamentos-icons.browser.mjs
          node scripts/meg-stage08-prism-typography.browser.mjs
          node scripts/meg-stage08-overdue-prism.browser.mjs
      - name: Validar URL pública Render com navegador e sem acesso à API real
        env:
          MEG_STAGE08_QA_URL: https://meg-stage08-funcional-pr677.onrender.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            "$MEG_STAGE08_QA_URL/stage08-funcional-qa.html?v=571cc7aabecf96a44ecb44dee5043823e6f6ac29" \
            -o /tmp/meg-stage08-public-html
          grep -q 'data-meg-stage08-qa="isolated"' /tmp/meg-stage08-public-html
          node scripts/meg-stage08-static-qa.browser.mjs
      - name: Verificar que a QA anterior da PR679 permanece independente
        env:
          MEG_STAGE08_QA_URL: https://meg-stage08-icones-pr679.onrender.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 35 \
            "$MEG_STAGE08_QA_URL/stage08-funcional-qa.html?v=5d296e72922ea25d37aac9df57cac74a51b75374" \
            -o /tmp/stage08-icons-public-html
          grep -q 'data-meg-stage08-qa="isolated"' /tmp/stage08-icons-public-html
          # Não impor a nova direção visual à publicação histórica imutável.
          node scripts/meg-stage08-static-qa.browser.mjs
      - name: Evidências visuais dos indicadores e botão de detalhes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meg-stage08-icons-visual-pr679
          path: artifacts/meg-stage08-lancamentos-icons/
          if-no-files-found: warn
          retention-days: 14
      - name: Preservar a QA tipográfica homologada da PR682 sem impor ícones novos
        env:
          MEG_STAGE08_QA_URL: https://meg-stage08-prism-tipografia-pilot.onrender.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 35 \
            "$MEG_STAGE08_QA_URL/stage08-funcional-qa.html?visual=prism&v=d2b45a72c6605467aa7f4377c8433282352b74fd" \
            -o /tmp/meg-prism-pilot-public
          grep -q 'data-meg-stage08-qa="isolated"' /tmp/meg-prism-pilot-public
          # O run #43244463748 comprovou as fontes na publicação histórica.
          # Novos ícones e novas direções pertencem apenas à QA da PR684.
          node scripts/meg-stage08-static-qa.browser.mjs
      - name: Validar ícones globais Prism e correção das setas na QA pública PR684
        env:
          MEG_STAGE08_QA_URL: https://meg-stage08-prism-rollout-pr684.onrender.com
          MEG_STAGE08_QA_VERSION: d857fcffb2dd3e98a18c3d349f899b18e5b6f311
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 35 \
            "$MEG_STAGE08_QA_URL/stage08-funcional-qa.html?visual=prism&v=d857fcffb2dd3e98a18c3d349f899b18e5b6f311" \
            -o /tmp/meg-prism-rollout-public
          grep -q 'data-meg-stage08-qa="isolated"' /tmp/meg-prism-rollout-public
          node scripts/meg-stage08-prism-typography.browser.mjs
          node scripts/meg-stage08-lancamentos-icons.browser.mjs
      - name: Evidências da tipografia Prism em três larguras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meg-stage08-prism-typography-pilot
          path: artifacts/meg-stage08-prism-typography/
          if-no-files-found: warn
          retention-days: 14
      - name: Verificar triângulos de vencimento na QA pública PR685
        env:
          MEG_STAGE08_QA_URL: https://meg-stage08-alerta-prism-pr685.onrender.com
          MEG_STAGE08_QA_VERSION: 0151bb45e5e805821cfafe3f53ed893a4008aa84
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 35 \
            "$MEG_STAGE08_QA_URL/stage08-funcional-qa.html?visual=prism&v=$MEG_STAGE08_QA_VERSION" \
            -o /tmp/meg-overdue-prism-public
          grep -q 'data-meg-stage08-qa="isolated"' /tmp/meg-overdue-prism-public
          node scripts/meg-stage08-overdue-prism.browser.mjs
      - name: Evidências visuais dos ícones de vencimento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meg-stage08-overdue-prism
          path: artifacts/meg-stage08-overdue-warning/
          if-no-files-found: warn
          retention-days: 14
      - name: Disponibilizar artefato estático validado da QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meg-stage08-funcional-qa-pr677
          path: apps/web/dist-stage08-funcional-qa/
          if-no-files-found: error
          retention-days: 30
