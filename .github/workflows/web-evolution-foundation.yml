name: MEG Web Evolution Foundation

on:
  push:
    branches:
      - 'meg-web-evolution/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  financial-characterization:
    if: startsWith(github.head_ref || github.ref_name, 'meg-web-evolution/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --audit=false

      - name: Inspect security blocker dependency paths
        shell: bash
        run: |
          npm explain @capacitor/android || true
          npm explain source-map-js || true
          node <<'NODE'
          const lock = require('./package-lock.json');
          for (const key of [
            '',
            'node_modules/@capacitor/android',
            'node_modules/@capacitor/core',
            'node_modules/@capacitor/cli',
            'node_modules/source-map-js',
          ]) {
            console.log('LOCK_ENTRY', key || '<root>', JSON.stringify(lock.packages?.[key] || null));
          }
          NODE

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/meg

      - name: Run financial characterization
        run: npm --workspace apps/api run test:finance
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/meg
          NODE_ENV: test

      - name: Run core financial tests
        run: npm run test:core
        env:
          NODE_ENV: test

      - name: Characterize legacy financial compatibility
        run: npm run test:legacy-finance

      - name: Characterize legacy status policy
        run: npm run test:transaction-status-policy

      - name: Validate Web Evolution single data source
        run: npm run test:evolution-data

      - name: Validate Web Evolution shell foundation
        run: npm run test:web-evolution-shell

      - name: Report Chrome binary
        shell: bash
        run: which google-chrome && google-chrome --version

      - name: Validate Web Evolution viewport contract
        shell: bash
        run: |
          VITE_PUBLIC_BASE_PATH=/ npm --workspace apps/web run dev -- --host 127.0.0.1 --port 4173 > /tmp/meg-web-evolution-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/web-evolution.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/web-evolution.html >/dev/null
          node apps/web/src/meg-web-evolution/shell/shell.viewport.browser.test.mjs

      - name: Print Vite log tail
        if: always()
        shell: bash
        run: tail -n 40 /tmp/meg-web-evolution-vite.log 2>/dev/null || true

      - name: Build API
        run: npm run build:api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/meg
          NODE_ENV: test
