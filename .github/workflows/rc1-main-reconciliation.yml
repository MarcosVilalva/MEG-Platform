name: RC1 Reconcile Main Into Phoenix

on:
  push:
    branches:
      - phoenix/v15-clean-room

permissions:
  contents: write

jobs:
  reconcile:
    if: contains(github.event.head_commit.message, 'execute main reconciliation')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Phoenix with full history
        uses: actions/checkout@v4
        with:
          ref: phoenix/v15-clean-room
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge latest main with explicit RC1 conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main phoenix/v15-clean-room
          git checkout -B rc1/phoenix-v15-integration origin/phoenix/v15-clean-room
          git merge --no-commit --no-ff origin/main || true

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'Conflitos detectados: %s\n' "${#conflicts[@]}"
          printf '%s\n' "${conflicts[@]}"

          for file in "${conflicts[@]}"; do
            case "$file" in
              apps/api/src/modules/finance/monetary-protection.ts|apps/web/*|docs/*|scripts/rc1-*|.github/workflows/*)
                git checkout --ours -- "$file" 2>/dev/null || git rm -f -- "$file"
                ;;
              *)
                git checkout --theirs -- "$file" 2>/dev/null || git rm -f -- "$file"
                ;;
            esac
          done

          # The temporary reconciliation runner is not allowed to publish workflow mutations.
          # Keep the entire workflow tree byte-for-byte equal to the Phoenix source branch;
          # CI enablement for rc1/** is applied afterwards through the authorized GitHub connector.
          git checkout origin/phoenix/v15-clean-room -- .github/workflows
          git add -A

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Ainda existem conflitos não resolvidos.'
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Restore RC1 release scripts without losing main tests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.scripts ||= {};
          root.scripts['test:phoenix-clean-room'] = "node apps/web/src/phoenix/phoenix-clean-room.test.js && node apps/web/src/phoenix/phoenix-preview-server.contract.test.js && node apps/web/src/phoenix/phoenix-write-gateway.contract.test.js";
          root.scripts['test:rc1-gate'] = 'node scripts/rc1-readiness-gate.mjs';
          root.scripts['test:catalog-ownership'] = 'npm --workspace packages/database run test:catalog-ownership';
          const required = ['test:visual-clean-room', 'test:phoenix-clean-room', 'test:rc1-gate', 'test:core', 'test:catalog-ownership'];
          const current = String(root.scripts.test || '').replace(/^npm-run-all\s+/, '').trim().split(/\s+/).filter(Boolean);
          const tail = current.filter((name) => !required.includes(name));
          root.scripts.test = `npm-run-all ${[...required, ...tail].join(' ')}`;
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');

          const apiPath = 'apps/api/package.json';
          const api = JSON.parse(fs.readFileSync(apiPath, 'utf8'));
          api.scripts ||= {};
          api.scripts['test:rc1-financial-e2e'] = 'tsx src/modules/finance/rc1-financial-e2e.test.ts';
          fs.writeFileSync(apiPath, JSON.stringify(api, null, 2) + '\n');
          NODE
          git add package.json apps/api/package.json

      - name: Reapply verified RC1 dependency pins
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --workspace apps/api @fastify/jwt@10.2.2 @fastify/swagger-ui@6.1.1 --save-exact
          npm install --package-lock-only --ignore-scripts --workspace apps/web echarts@6.1.0 --save-exact
          npm install --package-lock-only --ignore-scripts --workspace packages/database prisma@6.12.0 @prisma/client@6.12.0 --save-exact
          git add apps/api/package.json apps/web/package.json packages/database/package.json package-lock.json

      - name: Install reconciled graph
        run: npm install --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/meg

      - name: Run full reconciled RC1 regression
        run: npm run check
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/meg
          NODE_ENV: test
          CORS_ORIGINS: http://localhost:5173

      - name: Enforce zero high or critical dependency findings
        run: npm audit --audit-level=high

      - name: Commit and publish reconciled candidate
        shell: bash
        run: |
          git add -A
          git commit -m 'chore(rc1): reconcile Phoenix candidate with latest main'
          git push --force-with-lease origin HEAD:rc1/phoenix-v15-integration
