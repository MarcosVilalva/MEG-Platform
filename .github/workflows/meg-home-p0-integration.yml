name: MEG Home P0 - Integracao Isolada
on:
  push:
    branches:
      - 'integration/08-home-p0-canonical-20261111'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-p0-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --audit=false
      - name: Gerar cliente Prisma sem acessar banco
        run: npm run db:generate
      - name: Compilar API canônica
        run: npm --workspace apps/api run build
      - name: Testes API P0 e regressão financeira
        run: |
          npx tsx apps/api/src/modules/finance/home-commitments-read.contract.test.ts
          npm --workspace apps/api run test:finance
      - name: Contrato do consumidor Home P0
        run: npx tsx apps/web/src/meg-web-evolution/home/home-commitments-read.contract.test.ts
      - name: Compilar preview da Home sem publicar
        run: cd apps/web && npx vite build --config vite.fluxo-integrado-08.config.ts
      - name: Instalar Playwright para regressão visual
        run: npm install --no-save --package-lock=false --audit=false @playwright/test@1.64.0
      - name: Regressões visuais da Home aprovada
        env:
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 4173 --directory apps/web/dist-fluxo-integrado-08 >/tmp/meg-home-p0.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/fluxo-integrado-08.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/meg-06-home-refino.browser.mjs
          node scripts/meg-08-home-quick-actions.browser.mjs
          node scripts/meg-home-p0-authenticated.browser.mjs
      - name: Gate arquivos autorizados
        run: |
          set -euo pipefail
          BASE=e4e70c35c7aae8b5bcfcc5ab6b980701a44c5360
          git diff --name-only "$BASE" HEAD > /tmp/meg-home-p0-integration-files.txt
          cat /tmp/meg-home-p0-integration-files.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/meg-home-p0-integration.yml|apps/web/src/meg-web-evolution/home/HomeDashboard.tsx|apps/web/src/meg-web-evolution/home/home-dashboard.css|apps/web/src/meg-web-evolution/home/home-commitments-read.ts|apps/web/src/meg-web-evolution/home/home-commitments-read.contract.test.ts|apps/web/vite.fluxo-integrado-08.config.ts|scripts/meg-home-p0-authenticated.browser.mjs|docs/MEG-WEB-HOME-OVERDUE-READ-CONTRACT-20261110.md|MEG-WEB-CONTINUIDADE-OFICIAL.md)
                ;;
              *) echo "FORA DO ESCOPO: $path" >&2; exit 1;;
            esac
          done < /tmp/meg-home-p0-integration-files.txt
      - name: Artefato visual para homologacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meg-home-p0-preview
          path: apps/web/dist-fluxo-integrado-08/
          if-no-files-found: warn
          retention-days: 14
