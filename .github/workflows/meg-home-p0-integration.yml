name: MEG Home P0 - Integracao Isolada
on:
  push:
    branches:
      - 'integration/08-home-p0-canonical-20261111'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-p0-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Banco descartável: jamais reutilizar Supabase, Render ou segredos reais.
    env:
      DATABASE_URL: postgresql://meg_qa:meg_qa@127.0.0.1:5432/meg_home_p0_qa?schema=public
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: meg_home_p0_qa
          POSTGRES_USER: meg_qa
          POSTGRES_PASSWORD: meg_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meg_qa -d meg_home_p0_qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --audit=false
      - name: Gerar cliente Prisma sem acessar banco
        run: npm run db:generate
      - name: Compilar API canônica
        run: npm --workspace apps/api run build
      - name: Testes API P0 e regressão financeira
        run: |
          npx tsx apps/api/src/modules/finance/home-commitments-read.contract.test.ts
          npm --workspace apps/api run test:finance
      - name: Integração PostgreSQL 17 descartável com dados fictícios
        run: |
          test "$DATABASE_URL" = 'postgresql://meg_qa:meg_qa@127.0.0.1:5432/meg_home_p0_qa?schema=public' || { echo "Destino PostgreSQL proibido"; exit 1; }
          npx prisma db push --schema packages/database/prisma/schema.prisma --skip-generate
          npx tsx apps/api/src/modules/finance/home-commitments-postgres-isolated.test.ts
      - name: HTTP autenticado real e cliente Web contra PostgreSQL sintético
        env:
          NODE_ENV: test
          JWT_SECRET: meg-home-p0-qa-only-fictitious-jwt-secret-2026
          MEG_HOME_P0_HTTP_QA: '1'
        run: |
          test "$DATABASE_URL" = 'postgresql://meg_qa:meg_qa@127.0.0.1:5432/meg_home_p0_qa?schema=public' || { echo "Destino HTTP QA proibido"; exit 1; }
          npx tsx apps/api/src/modules/finance/home-commitments-http-isolated.test.ts
      - name: Contrato do consumidor Home P0
        run: npx tsx apps/web/src/meg-web-evolution/home/home-commitments-read.contract.test.ts
      - name: Compilar preview da Home sem publicar
        run: cd apps/web && npx vite build --config vite.fluxo-integrado-08.config.ts
      - name: Instalar Playwright para regressão visual
        run: npm install --no-save --package-lock=false --audit=false @playwright/test@1.64.0
      - name: Regressões visuais da Home aprovada
        env:
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 4173 --directory apps/web/dist-fluxo-integrado-08 >/tmp/meg-home-p0.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/fluxo-integrado-08.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/meg-06-home-refino.browser.mjs
          node scripts/meg-08-home-quick-actions.browser.mjs
          node scripts/meg-home-p0-authenticated.browser.mjs
      - name: Home P0 no navegador com API e PostgreSQL reais de QA
        env:
          NODE_ENV: test
          JWT_SECRET: meg-home-p0-qa-only-fictitious-jwt-secret-2026
          MEG_HOME_P0_HTTP_QA: '1'
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
        run: |
          test "$DATABASE_URL" = 'postgresql://meg_qa:meg_qa@127.0.0.1:5432/meg_home_p0_qa?schema=public' || { echo "Banco QA proibido"; exit 1; }
          npx tsx scripts/meg-home-p0-live-browser.browser.mjs
      - name: Gate arquivos autorizados
        run: |
          set -euo pipefail
          BASE=e4e70c35c7aae8b5bcfcc5ab6b980701a44c5360
          git diff --name-only "$BASE" HEAD > /tmp/meg-home-p0-integration-files.txt
          cat /tmp/meg-home-p0-integration-files.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/meg-home-p0-integration.yml|apps/web/src/meg-web-evolution/home/HomeDashboard.tsx|apps/web/src/meg-web-evolution/home/HomeCommitmentsFullList.tsx|apps/web/src/meg-web-evolution/home/HomeDueAlerts.tsx|apps/web/src/meg-web-evolution/home/home-due-alerts.css|apps/web/src/meg-web-evolution/home/home-dashboard.css|apps/web/src/meg-web-evolution/shell/AppShell.tsx|apps/web/src/meg-web-evolution/main.tsx|apps/web/src/meg-web-evolution/home/home-commitments-read.ts|apps/web/src/meg-web-evolution/home/home-commitments-read.contract.test.ts|apps/api/src/modules/finance/home-commitments-postgres-isolated.test.ts|apps/api/src/modules/finance/home-commitments-http-isolated.test.ts|apps/web/vite.fluxo-integrado-08.config.ts|scripts/meg-home-p0-authenticated.browser.mjs|scripts/meg-home-p0-live-browser.browser.mjs|docs/MEG-WEB-HOME-OVERDUE-READ-CONTRACT-20261110.md|MEG-WEB-CONTINUIDADE-OFICIAL.md)
                ;;
              *) echo "FORA DO ESCOPO: $path" >&2; exit 1;;
            esac
          done < /tmp/meg-home-p0-integration-files.txt
      - name: Evidencias visuais leves, sem empacotar assets do site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meg-home-p0-qa
          path: |
            artifacts/meg-home-refino-06/
            artifacts/meg-home-p0-qa/
            artifacts/meg-home-p0-live/
          if-no-files-found: warn
          retention-days: 7
