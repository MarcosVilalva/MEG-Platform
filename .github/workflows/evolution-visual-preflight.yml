name: MEG Evolution Visual Preflight

on:
  pull_request:
    paths:
      - 'apps/web/evolution.html'
      - 'apps/web/src/evolution/**'
      - 'scripts/evolution-system-smoke.mjs'
      - 'apps/web/public/evolution/**'
      - 'docs/EVOLUTION-VISUAL-CONTRACT.md'
      - 'docs/EVOLUTION-VISUAL-QA.md'
      - '.github/workflows/evolution-visual-preflight.yml'
  workflow_dispatch:
    inputs:
      route:
        description: 'Rota relativa a capturar'
        required: false
        default: 'evolution.html'
        type: string
      width:
        description: 'Largura do viewport'
        required: false
        default: '1254'
        type: string
      height:
        description: 'Altura do viewport'
        required: false
        default: '1254'
        type: string
      wait_ms:
        description: 'Tempo de espera antes da captura'
        required: false
        default: '4500'
        type: string

permissions:
  contents: read

jobs:
  capture:
    name: capture-evolution
    runs-on: ubuntu-latest
    env:
      PREVIEW_ROUTE: ${{ inputs.route || 'evolution.html' }}
      PREVIEW_WIDTH: ${{ inputs.width || '1254' }}
      PREVIEW_HEIGHT: ${{ inputs.height || '1254' }}
      PREVIEW_WAIT_MS: ${{ inputs.wait_ms || '4500' }}
      VITE_PUBLIC_BASE_PATH: /
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Protect Android and Mobile reference
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- android apps/web/src/mobile)"
          if [ -n "$CHANGED" ]; then
            echo "::error::Evolution Web não pode modificar /android ou apps/web/src/mobile."
            echo "$CHANGED"
            exit 1
          fi
          echo "Android/Mobile preservado: nenhuma alteração detectada."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web preview
        run: npm run build:web

      - name: Install Chromium for visual capture
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify layouts and protected financial flows with mock API
        run: node scripts/evolution-system-smoke.mjs

      - name: Start static preview
        run: |
          python3 -m http.server 4173 --directory apps/web/dist >/tmp/evolution-preview.log 2>&1 &
          echo $! >/tmp/evolution-preview.pid
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:4173/evolution.html" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/evolution-preview.log
          exit 1

      - name: Capture Evolution visual set
        run: |
          mkdir -p artifacts

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="${PREVIEW_WIDTH},${PREVIEW_HEIGHT}" \
            --wait-for-timeout="${PREVIEW_WAIT_MS}" \
            "http://127.0.0.1:4173/${PREVIEW_ROUTE}" \
            "artifacts/evolution-${PREVIEW_WIDTH}x${PREVIEW_HEIGHT}.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1440,900" \
            --wait-for-timeout="1200" \
            "http://127.0.0.1:4173/evolution.html?screen=login" \
            "artifacts/evolution-login-desktop-1440x900.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1672,941" \
            --wait-for-timeout="1800" \
            "http://127.0.0.1:4173/evolution.html?screen=login" \
            "artifacts/evolution-login-reference-1672x941.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="430,932" \
            --wait-for-timeout="1200" \
            "http://127.0.0.1:4173/evolution.html?screen=login" \
            "artifacts/evolution-login-vertical-430x932.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1254,1254" \
            --wait-for-timeout="1200" \
            "http://127.0.0.1:4173/evolution.html?screen=loading" \
            "artifacts/evolution-loading-frozen-1254x1254.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1364,626" \
            --wait-for-timeout="1200" \
            "http://127.0.0.1:4173/evolution.html?screen=loading" \
            "artifacts/evolution-loading-wide-1364x626.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="430,932" \
            --wait-for-timeout="1200" \
            "http://127.0.0.1:4173/evolution.html?screen=loading" \
            "artifacts/evolution-loading-vertical-430x932.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1672,941" \
            --wait-for-timeout="1800" \
            "http://127.0.0.1:4173/evolution.html?screen=system" \
            "artifacts/evolution-home-1672x941.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1648,744" \
            --wait-for-timeout="1800" \
            "http://127.0.0.1:4173/evolution.html?screen=system" \
            "artifacts/evolution-home-compact-1648x744.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1672,941" \
            --wait-for-timeout="1800" \
            "http://127.0.0.1:4173/evolution.html?screen=system&modal=launch" \
            "artifacts/evolution-launch-choose-1672x941.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1672,941" \
            --wait-for-timeout="1800" \
            "http://127.0.0.1:4173/evolution.html?screen=system&modal=launch&mode=expense" \
            "artifacts/evolution-launch-expense-1672x941.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1366,768" \
            --wait-for-timeout="1800" \
            "http://127.0.0.1:4173/evolution.html?screen=system&modal=launch&mode=expense" \
            "artifacts/evolution-launch-expense-compact-1366x768.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1672,941" \
            --wait-for-timeout="1800" \
            "http://127.0.0.1:4173/evolution.html?screen=system&modal=launch&mode=expense&picker=category" \
            "artifacts/evolution-launch-categories-1672x941.png"

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1672,941" \
            --wait-for-timeout="1800" \
            "http://127.0.0.1:4173/evolution.html?screen=system&view=movements" \
            "artifacts/evolution-movements-1672x941.png"

          for preview in home movements launch payables settlement cards card-center benefit cashflow analytics history settings period notifications menu transfer card-payment edit-launch benefit-recharge; do
            npx --yes playwright@1.55.0 screenshot \
              --viewport-size="1672,941" \
              --wait-for-timeout="1200" \
              "http://127.0.0.1:4173/evolution.html?screen=preview&preview=${preview}" \
              "artifacts/evolution-preview-${preview}-1672x941.png"
          done

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1648,744" \
            --wait-for-timeout="1200" \
            "http://127.0.0.1:4173/evolution.html?screen=preview&preview=home" \
            "artifacts/evolution-preview-home-compact-1648x744.png"

          # /FULL responsive gate: telas estruturais nas resoluções críticas.
          for preview in home movements analytics settings; do
            npx --yes playwright@1.55.0 screenshot \
              --viewport-size="1366,768" \
              --wait-for-timeout="1200" \
              "http://127.0.0.1:4173/evolution.html?screen=preview&preview=${preview}" \
              "artifacts/evolution-responsive-${preview}-1366x768.png"
            npx --yes playwright@1.55.0 screenshot \
              --viewport-size="430,932" \
              --wait-for-timeout="1200" \
              "http://127.0.0.1:4173/evolution.html?screen=preview&preview=${preview}" \
              "artifacts/evolution-responsive-${preview}-430x932.png"
          done

          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1366,768" \
            --wait-for-timeout="1200" \
            "http://127.0.0.1:4173/evolution.html?screen=preview&preview=settings&settingsTab=catalogs&catalog=categories" \
            "artifacts/evolution-settings-catalogs-1366x768.png"
          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="430,932" \
            --wait-for-timeout="1200" \
            "http://127.0.0.1:4173/evolution.html?screen=preview&preview=settings&settingsTab=catalogs&catalog=categories" \
            "artifacts/evolution-settings-catalogs-430x932.png"

          for viewport in "1024,768" "768,1024"; do
            width="${viewport%,*}"
            height="${viewport#*,}"
            npx --yes playwright@1.55.0 screenshot \
              --viewport-size="${width},${height}" \
              --wait-for-timeout="1200" \
              "http://127.0.0.1:4173/evolution.html?screen=preview&preview=home" \
              "artifacts/evolution-responsive-home-${width}x${height}.png"
          done

      - name: Record capture metadata
        run: |
          cat > artifacts/visual-preflight.txt <<EOF
          requested_route=${PREVIEW_ROUTE}
          requested_viewport=${PREVIEW_WIDTH}x${PREVIEW_HEIGHT}
          login_desktop=1440x900
          login_reference=1672x941
          login_vertical=430x932
          loading_frozen=1254x1254
          loading_wide=1364x626
          loading_vertical=430x932
          home_command_center=1672x941
          home_compact_desktop=1648x744
          launch_choose=1672x941
          launch_expense=1672x941
          launch_expense_compact=1366x768
          launch_categories=1672x941
          movements_desktop=1672x941
          preview_home=1672x941
          preview_home_compact=1648x744
          preview_movements=1672x941
          preview_launch=1672x941
          preview_payables=1672x941
          preview_settlement=1672x941
          preview_cards=1672x941
          preview_card_center=1672x941
          preview_benefit=1672x941
          preview_cashflow=1672x941
          preview_analytics=1672x941
          preview_history=1672x941
          preview_settings=1672x941
          preview_period=1672x941
          preview_notifications=1672x941
          preview_menu=1672x941
          responsive_core=home,movements,analytics,settings@1366x768+430x932
          responsive_home_extra=1024x768+768x1024
          settings_catalogs=1366x768+430x932
          commit=${GITHUB_SHA}
          rule=CI verde nao equivale a validacao visual. Todas as capturas devem ser comparadas com a referencia aprovada antes de declarar pronto.
          EOF

      - name: Upload visual preflight
        uses: actions/upload-artifact@v4
        with:
          name: evolution-visual-preflight
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
