name: RC1 Runtime Smoke

on:
  push:
    branches:
      - rc1/phoenix-v15-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PREVIEW_URL: https://meg-phoenix-rc1-preview.onrender.com

    steps:
      - name: Wait for isolated RC1 preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            echo "Aguardando RC1 isolado, tentativa ${attempt}/24"
            if curl --silent --show-error --fail --max-time 30 \
              "$PREVIEW_URL/preview-health?cb=$GITHUB_SHA" -o /tmp/preview-health.json; then
              cat /tmp/preview-health.json | jq .
              STATUS=$(jq -r '.status // ""' /tmp/preview-health.json)
              MODE=$(jq -r '.mode // ""' /tmp/preview-health.json)
              SIMPLE=$(jq -r '.capabilities.simpleEventWrite | if . == null then "missing" else tostring end' /tmp/preview-health.json)
              PENDING=$(jq -r '.capabilities.pendingWrite | if . == null then "missing" else tostring end' /tmp/preview-health.json)
              BULK=$(jq -r '.capabilities.bulkEventWrite | if . == null then "missing" else tostring end' /tmp/preview-health.json)
              if [ "$STATUS" = "ok" ] \
                && [ "$MODE" = "phoenix-finance-read-only-preview" ] \
                && [ "$SIMPLE" = "false" ] \
                && [ "$PENDING" = "false" ] \
                && [ "$BULK" = "false" ]; then
                echo "RC1 isolado respondeu em modo financeiro somente leitura."
                exit 0
              fi
            fi
            sleep 15
          done
          echo "O RC1 isolado não ficou pronto no modo seguro esperado."
          exit 1

      - name: Verify Phoenix shell and security headers
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 45 \
            -D /tmp/phoenix-headers.txt \
            "$PREVIEW_URL/phoenix.html?cb=$GITHUB_SHA" \
            -o /tmp/phoenix.html

          grep -q 'MEG Phoenix V15' /tmp/phoenix.html
          grep -Eqi '^cache-control:[[:space:]]*no-store' /tmp/phoenix-headers.txt
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' /tmp/phoenix-headers.txt
          grep -Eqi '^x-frame-options:[[:space:]]*DENY' /tmp/phoenix-headers.txt
          grep -Eqi '^referrer-policy:[[:space:]]*no-referrer' /tmp/phoenix-headers.txt
          echo "Shell Phoenix e cabeçalhos de segurança aprovados."

      - name: Verify read path to production API
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 90 \
            "$PREVIEW_URL/health" -o /tmp/api-health.json
          cat /tmp/api-health.json | jq .
          grep -q '"cloud-state"' /tmp/api-health.json
          echo "Proxy de leitura do RC1 alcança a API oficial."

      - name: Prove financial writes are blocked in preview
        shell: bash
        run: |
          set -euo pipefail
          check_blocked() {
            local path="$1"
            local body_file="/tmp/blocked-$(echo "$path" | tr '/:' '--').json"
            local status
            status=$(curl --silent --show-error --max-time 30 \
              -o "$body_file" -w '%{http_code}' \
              -X POST "$PREVIEW_URL$path" \
              -H 'Content-Type: application/json' \
              --data '{}')
            echo "$path -> HTTP $status"
            cat "$body_file"
            test "$status" = "405"
            grep -q 'PREVIEW_READ_ONLY' "$body_file"
          }

          check_blocked '/finance/events'
          check_blocked '/finance/events/bulk/update'
          check_blocked '/finance/events/test-event/settle'
          check_blocked '/finance/transfers'
          check_blocked '/payables/recurring'
          check_blocked '/payables/test-payable/payments'
          echo "Mutações financeiras, incluindo transferência e recorrência, bloqueadas antes de alcançar a API."

      - name: RC1 runtime smoke summary
        run: |
          echo "RC1 runtime smoke APROVADO."
          echo "Preview: $PREVIEW_URL"
          echo "Commit disparador: $GITHUB_SHA"
          echo "Estado: interface acessível, API de leitura disponível e writes financeiros bloqueados."
