name: MEG Home 06 - Refinamento Visual Protegido
on:
  push:
    branches:
      - 'preview/06-home-refino-preservado-20261104'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-preview-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verificar sintaxe do navegador
        run: node --check scripts/meg-06-home-refino.browser.mjs
      - name: Instalar dependencias
        run: npm ci --audit=false
      - name: Compilar o preview integrado isolado
        run: cd apps/web && npx vite build --config vite.fluxo-integrado-08.config.ts
      - name: Instalar runtime de testes
        run: npm install --no-save --package-lock=false --audit=false @playwright/test@1.64.0
      - name: Revisar nove resolucoes com baseline/candidato + fluxo protegido
        shell: bash
        env:
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 4173 --directory apps/web/dist-fluxo-integrado-08 >/tmp/home06-preview.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/fluxo-integrado-08.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/fluxo-integrado-08.html >/dev/null
          node scripts/meg-06-home-refino.browser.mjs
      - name: Guardar capturas e metricas comparativas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meg06-home-candidato-baseline
          path: artifacts/meg-home-refino-06/
          if-no-files-found: warn
