name: Apply urgent web performance fix

on:
  push:
    branches:
      - agent/urgent-web-memory-benefit-balance
    paths:
      - '.urgent-performance/**'
      - '.github/workflows/apply-urgent-performance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/urgent-web-memory-benefit-balance
          fetch-depth: 0

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .urgent-performance/part-* | base64 --decode | gzip --decompress > /tmp/urgent-performance.patch
          git apply --check /tmp/urgent-performance.patch
          git apply /tmp/urgent-performance.patch

      - name: Validate JavaScript and financial rules
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/web/src/legacy-app.js
          node --check apps/web/src/legacy-cloud.js
          node --check apps/web/src/legacy-finance.js
          node --check apps/web/src/legacy-state-patch.js
          node apps/web/src/legacy-state-patch.test.js
          node apps/web/src/legacy-finance.test.js
          node packages/core/src/tests/core.test.js

      - name: Remove temporary delivery files
        shell: bash
        run: |
          rm -rf .urgent-performance
          rm -f .github/workflows/apply-urgent-performance.yml

      - name: Commit final changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MEG Performance Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(web): reduzir memória e carregar saldo de benefícios'
          git push origin HEAD:agent/urgent-web-memory-benefit-balance
