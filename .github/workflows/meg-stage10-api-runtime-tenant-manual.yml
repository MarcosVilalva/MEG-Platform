name: MEG Stage10 PG17 connection guard diagnosis (READ ONLY)

on:
  push:
    branches: [stage10/android-confirmacao-qa-20261118]
    paths:
      - '.github/workflows/meg-stage10-api-runtime-tenant-manual.yml'

permissions:
  contents: read

jobs:
  guard-readonly:
    if: >-
      github.repository == 'MarcosVilalva/MEG-Platform' &&
      github.ref == 'refs/heads/stage10/android-confirmacao-qa-20261118' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'test(stage10): diagnostico read-only IP guard PG17 descartavel'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: meg_stage10_runtime_sandbox
          POSTGRES_USER: meg_stage10_ci_admin
          POSTGRES_PASSWORD: stage10_ci_admin_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meg_stage10_ci_admin -d meg_stage10_runtime_sandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact authorization marker and context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$GITHUB_REPOSITORY" = "MarcosVilalva/MEG-Platform"
          test "$GITHUB_REF" = "refs/heads/stage10/android-confirmacao-qa-20261118"
          test "$(cat docs/MEG-STAGE10-RUNTIME-QA-APROVACAO.txt)" = "AUTORIZO_SOMENTE_QA_DESCARTAVEL_ETAPA10_20261119"
          echo 'MEG_STAGE10_READONLY_CONTEXT=PASS'
      - name: ONE diagnostic SELECT in READ ONLY transaction, no schema or role operations
        shell: bash
        env:
          PGPASSWORD: stage10_ci_admin_disposable_only
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -A -F '|' -P footer=off \
            -h 127.0.0.1 -p 5432 -U meg_stage10_ci_admin -d meg_stage10_runtime_sandbox <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT
            current_database() AS banco,
            current_user AS usuario,
            inet_server_addr()::text AS ip_servidor,
            inet_client_addr()::text AS ip_cliente,
            current_setting('port') AS porta,
            (current_database() <> 'meg_stage10_runtime_sandbox') AS rejeita_banco,
            (current_user <> 'meg_stage10_ci_admin') AS rejeita_usuario,
            (inet_server_addr() IS DISTINCT FROM '127.0.0.1'::inet) AS rejeita_ip_original,
            (current_setting('port') <> '5432') AS rejeita_porta,
            (
              current_database() <> 'meg_stage10_runtime_sandbox'
              OR current_user <> 'meg_stage10_ci_admin'
              OR inet_server_addr() IS DISTINCT FROM '127.0.0.1'::inet
              OR current_setting('port') <> '5432'
            ) AS guarda_original_rejeitaria;
          ROLLBACK;
          SQL
          echo 'MEG_STAGE10_READONLY_DIAGNOSTIC_COMPLETE=PASS'
