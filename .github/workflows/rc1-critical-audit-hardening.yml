name: RC1 Critical Audit Hardening

on:
  push:
    branches:
      - rc1/phoenix-v15-integration

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, 'execute critical audit hardening')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: meg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/meg
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:5173
    steps:
      - name: Checkout RC1
        uses: actions/checkout@v4
        with:
          ref: rc1/phoenix-v15-integration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply critical audit hardening
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) FinancialEvent legacy PATCH/CREATE cannot attach another user's catalog IDs.
          path = 'apps/api/src/modules/finance/service.ts'
          p = Path(path)
          text = p.read_text()
          old = "async function validateActiveReferences(tx: Tx, input: { accountId?: string; categoryId?: string; paymentMethodId?: string }) {\n  if (input.accountId) {\n    const account = await tx.account.findFirst({ where: { id: input.accountId, isActive: true }, select: { id: true } });\n    if (!account) throw new Error('INVALID_ACCOUNT');\n  }\n  if (input.categoryId) {\n    const category = await tx.category.findFirst({ where: { id: input.categoryId, isActive: true }, select: { id: true } });\n    if (!category) throw new Error('INVALID_CATEGORY');\n  }\n  if (input.paymentMethodId) {\n    const method = await tx.paymentMethod.findFirst({ where: { id: input.paymentMethodId, isActive: true }, select: { id: true } });\n    if (!method) throw new Error('INVALID_PAYMENT_METHOD');\n  }\n}"
          new = "async function validateActiveReferences(tx: Tx, userId: string, input: { accountId?: string; categoryId?: string; paymentMethodId?: string }) {\n  if (input.accountId) {\n    const account = await tx.account.findFirst({ where: { id: input.accountId, userId, isActive: true }, select: { id: true } });\n    if (!account) throw new Error('INVALID_ACCOUNT');\n  }\n  if (input.categoryId) {\n    const category = await tx.category.findFirst({ where: { id: input.categoryId, userId, isActive: true }, select: { id: true } });\n    if (!category) throw new Error('INVALID_CATEGORY');\n  }\n  if (input.paymentMethodId) {\n    const method = await tx.paymentMethod.findFirst({ where: { id: input.paymentMethodId, userId, isActive: true }, select: { id: true } });\n    if (!method) throw new Error('INVALID_PAYMENT_METHOD');\n  }\n}"
          if old not in text:
              raise SystemExit('finance service reference validator block not found')
          text = text.replace(old, new, 1)
          if text.count('await validateActiveReferences(tx, input);') != 2:
              raise SystemExit('unexpected validateActiveReferences call count')
          text = text.replace('await validateActiveReferences(tx, input);', 'await validateActiveReferences(tx, userId, input);')
          p.write_text(text)

          # 2) Reject impossible calendar days in transfers.
          replace_once(
              'apps/api/src/modules/finance/transfer-core.ts',
              "function assertIsoDay(value: string) {\n  if (!/^\\d{4}-\\d{2}-\\d{2}/.test(value)) throw new Error('INVALID_TRANSFER_DATE');\n}",
              "function assertIsoDay(value: string) {\n  const match = value.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\n  if (!match) throw new Error('INVALID_TRANSFER_DATE');\n  const year = Number(match[1]);\n  const month = Number(match[2]);\n  const day = Number(match[3]);\n  const parsed = new Date(Date.UTC(year, month - 1, day));\n  if (\n    !Number.isInteger(year)\n    || month < 1\n    || month > 12\n    || day < 1\n    || parsed.getUTCFullYear() !== year\n    || parsed.getUTCMonth() !== month - 1\n    || parsed.getUTCDate() !== day\n  ) throw new Error('INVALID_TRANSFER_DATE');\n}"
          )

          transfer_test = Path('apps/api/src/modules/finance/transfer-core.test.ts')
          t = transfer_test.read_text()
          marker = "assert.throws(() => buildTransferLegs({\n  transferId: 'transfer-004', sourceAccountId: 'a', destinationAccountId: 'b', amount: 10, date: '12/09/2026'\n}), /INVALID_TRANSFER_DATE/);"
          addition = marker + "\n\nassert.throws(() => buildTransferLegs({\n  transferId: 'transfer-005', sourceAccountId: 'a', destinationAccountId: 'b', amount: 10, date: '2026-02-31'\n}), /INVALID_TRANSFER_DATE/);"
          if marker not in t:
              raise SystemExit('transfer test insertion point not found')
          transfer_test.write_text(t.replace(marker, addition, 1))

          # 3) All public day fields use strict, real calendar dates.
          strict_schema = "const isoDaySchema = z.string().regex(/^\\d{4}-\\d{2}-\\d{2}$/).refine((value) => {\n  const parsed = new Date(`${value}T12:00:00.000Z`);\n  return !Number.isNaN(parsed.getTime()) && parsed.toISOString().slice(0, 10) === value;\n}, 'INVALID_DATE');"
          replace_once(
              'apps/api/src/modules/payables/routes.ts',
              "const isoDaySchema = z.string().regex(/^\\d{4}-\\d{2}-\\d{2}/);",
              strict_schema,
          )

          receivables = Path('apps/api/src/modules/receivables/routes.ts')
          r = receivables.read_text()
          needle = "const operationIdSchema = z.string().trim().min(8).max(128).optional();"
          if needle not in r:
              raise SystemExit('receivables schema insertion point not found')
          r = r.replace(needle, needle + "\n" + strict_schema, 1)
          r = r.replace("dueDate: z.string().min(10),", "dueDate: isoDaySchema,", 1)
          r = r.replace("receivedAt: z.string().min(10),", "receivedAt: isoDaySchema,", 1)
          receivables.write_text(r)

          cards = Path('apps/api/src/modules/cards/routes.ts')
          c = cards.read_text()
          old_purchase = "purchaseDate: z.string().min(10),"
          if old_purchase not in c:
              raise SystemExit('card purchase date schema not found')
          cards.write_text(c.replace(old_purchase, "purchaseDate: isoDateSchema,", 1))

          # 4) Permanent E2E proof against cross-user catalog injection.
          e2e = Path('apps/api/src/modules/finance/rc1-financial-e2e.test.ts')
          e = e2e.read_text()
          account_marker = "  const effectiveDay = dayBefore(2);"
          block = """  const foreignUser = await prisma.user.create({
    data: {
      name: 'RC1 Foreign Catalog Owner',
      email: `rc1-foreign-${suffix}@meg.local`,
      passwordHash: 'not-used-in-e2e',
      role: UserRole.ADMIN,
      status: UserStatus.ACTIVE,
      isActive: true,
      approvedAt: new Date(),
    },
  });
  const foreignAccount = await prisma.account.create({
    data: {
      userId: foreignUser.id,
      name: 'Conta estrangeira RC1',
      type: 'CHECKING',
      openingBalance: 9999,
      isActive: true,
    },
  });

  await assert.rejects(
    () => createFinancialEvent(user.id, {
      description: 'RC1 tentativa de conta de outro usuário',
      type: 'expense',
      status: 'paid',
      date: `${dayBefore(2)}T12:00:00.000Z`,
      amount: 1,
      accountId: foreignAccount.id,
    }),
    (error: unknown) => error instanceof Error && error.message === 'INVALID_ACCOUNT',
    'Evento financeiro não pode usar conta pertencente a outro usuário.',
  );

"""
          if account_marker not in e:
              raise SystemExit('financial e2e insertion point not found')
          e = e.replace(account_marker, block + account_marker, 1)

          update_marker = "  const updatedExpense = await updateFinancialEvent(user.id, expense.id, { amount: 250 });"
          update_block = """  await assert.rejects(
    () => updateFinancialEvent(user.id, expense.id, { accountId: foreignAccount.id }),
    (error: unknown) => error instanceof Error && error.message === 'INVALID_ACCOUNT',
    'Edição financeira não pode trocar o lançamento para conta de outro usuário.',
  );

"""
          if update_marker not in e:
              raise SystemExit('financial update e2e insertion point not found')
          e2e.write_text(e.replace(update_marker, update_block + update_marker, 1))
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run full RC1 regression
        run: npm run check

      - name: Prepare ephemeral database
        run: npm run db:push

      - name: Run financial E2E
        run: npm --workspace apps/api run test:rc1-financial-e2e

      - name: Enforce dependency security gate
        run: npm audit --audit-level=high

      - name: Commit hardened RC1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/modules/finance/service.ts \
                  apps/api/src/modules/finance/transfer-core.ts \
                  apps/api/src/modules/finance/transfer-core.test.ts \
                  apps/api/src/modules/finance/rc1-financial-e2e.test.ts \
                  apps/api/src/modules/payables/routes.ts \
                  apps/api/src/modules/receivables/routes.ts \
                  apps/api/src/modules/cards/routes.ts
          git commit -m 'fix(rc1): harden financial ownership and calendar validation'
          git push origin HEAD:rc1/phoenix-v15-integration
