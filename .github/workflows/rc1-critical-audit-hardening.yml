name: RC1 Critical Audit Hardening

on:
  push:
    branches:
      - rc1/phoenix-v15-integration

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, 'execute critical audit hardening')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: meg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/meg
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:5173
    steps:
      - name: Checkout RC1
        uses: actions/checkout@v4
        with:
          ref: rc1/phoenix-v15-integration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply critical audit hardening
        run: node scripts/rc1-critical-audit-hardening.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run full RC1 regression
        run: npm run check

      - name: Prepare ephemeral database
        run: npm run db:push

      - name: Run financial E2E
        run: npm --workspace apps/api run test:rc1-financial-e2e

      - name: Enforce dependency security gate
        run: npm audit --audit-level=high

      - name: Commit hardened RC1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/modules/finance/service.ts \
                  apps/api/src/modules/finance/transfer-core.ts \
                  apps/api/src/modules/finance/transfer-core.test.ts \
                  apps/api/src/modules/finance/rc1-financial-e2e.test.ts \
                  apps/api/src/modules/payables/routes.ts \
                  apps/api/src/modules/receivables/routes.ts \
                  apps/api/src/modules/cards/routes.ts
          git commit -m 'fix(rc1): harden financial ownership and calendar validation'
          git push origin HEAD:rc1/phoenix-v15-integration
