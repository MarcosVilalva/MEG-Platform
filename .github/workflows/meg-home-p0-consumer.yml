name: MEG Home P0 - Integracao Sem Deploy
on:
  push:
    branches:
      - 'audit/08-home-p0-consumer-20261111'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-home-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --audit=false
      - name: Gerar Prisma sem conexão com banco
        run: npm run db:generate
      - name: Compilar fonte API autorizada
        run: npm --workspace apps/api run build
      - name: Contratos de API e cliente P0
        run: |
          npx tsx apps/api/src/modules/finance/home-commitments-read.contract.test.ts
          npx tsx apps/web/src/meg-web-evolution/home/home-commitments-client.contract.test.ts
      - name: Regressão financeira da API
        run: npm --workspace apps/api run test:finance
      - name: Typecheck Web
        run: npx tsc -p apps/web/tsconfig.json --noEmit
      - name: Build isolado de Home sem publicação
        run: cd apps/web && npx vite build --config vite.fluxo-integrado-08.config.ts
      - name: Testes visuais existentes sem mudar a Home aprovada
        run: npm install --no-save --package-lock=false --audit=false @playwright/test@1.64.0
      - name: Executar QA de 8 viewports
        env:
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 4173 --directory apps/web/dist-fluxo-integrado-08 >/tmp/meg-home-p0.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/fluxo-integrado-08.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/meg-06-home-refino.browser.mjs
          node scripts/meg-08-home-quick-actions.browser.mjs
      - name: Bloquear mudanças fora do consumidor autorizado
        run: |
          set -euo pipefail
          BASE=e4e70c35c7aae8b5bcfcc5ab6b980701a44c5360
          git diff --name-only "$BASE" HEAD > /tmp/meg-p0-consumer-files.txt
          cat /tmp/meg-p0-consumer-files.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/meg-home-p0-consumer.yml|apps/web/src/meg-web-evolution/home/HomeDashboard.tsx|apps/web/src/meg-web-evolution/home/home-dashboard.css|apps/web/src/meg-web-evolution/home/home-commitments-client.ts|apps/web/src/meg-web-evolution/home/home-commitments-client.contract.test.ts|MEG-WEB-CONTINUIDADE-OFICIAL.md|docs/MEG-WEB-HOME-OVERDUE-READ-CONTRACT-20261110.md)
                ;;
              *) echo "ARQUIVO FORA DO ESCOPO: $path" >&2; exit 1 ;;
            esac
          done < /tmp/meg-p0-consumer-files.txt
      - name: Empacotar preview para análise, SEM deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meg-home-p0-preview-estatico
          path: apps/web/dist-fluxo-integrado-08/
          if-no-files-found: warn
          retention-days: 14
