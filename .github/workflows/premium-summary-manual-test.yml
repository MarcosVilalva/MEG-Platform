name: MEG Premium Summary Manual Test

on:
  push:
    branches:
      - ops/premium-summary-test-20260924

permissions:
  contents: read

jobs:
  premium-summary-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ vars.VITE_API_URL || 'https://meg-platform-api.onrender.com' }}
      CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
    steps:
      - name: Wait for production API
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo "NOTIFICATION_CRON_SECRET is not configured"; exit 1; }
          for attempt in {1..6}; do
            if curl --silent --show-error --max-time 60 --fail "$API_URL/ready" > /tmp/ready.json; then
              cat /tmp/ready.json | jq .
              exit 0
            fi
            echo "API still waking up ($attempt/6)"
            sleep 10
          done
          exit 1

      - name: Send Premium daily summary now
        run: |
          set -euo pipefail
          RESPONSE=$(curl --silent --show-error --fail-with-body --max-time 180 \
            -X POST "$API_URL/notifications/cron" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"slot":"06:00","force":true}')
          echo "$RESPONSE" > /tmp/response.json
          echo "$RESPONSE" | jq '{users, slot, statuses: [.. | objects | select(.status? != null) | .status]}'

          FAILED=$(echo "$RESPONSE" | jq '[.. | objects | select(.status? == "failed")] | length')
          WHATSAPP_OK=$(echo "$RESPONSE" | jq '[.. | objects | select((.channel? // "") | startswith("whatsapp:")) | select(.status? == "sent" or .status? == "already-sent")] | length')
          EMAIL_OK=$(echo "$RESPONSE" | jq '[.. | objects | select((.channel? // "") | startswith("email:")) | select(.status? == "sent" or .status? == "already-sent")] | length')

          echo "whatsapp_ok=$WHATSAPP_OK email_ok=$EMAIL_OK failed=$FAILED"
          test "$FAILED" -eq 0
          test "$WHATSAPP_OK" -ge 2
          test "$EMAIL_OK" -ge 1
