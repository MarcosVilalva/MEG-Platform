name: Apply transaction editor v2

on:
  push:
    branches:
      - agent/rebuild-web-transaction-editor
    paths:
      - scripts/apply_transaction_editor_v2.py
      - .github/workflows/apply-transaction-editor-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[editor-v2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-web-transaction-editor
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply editor patch
        run: python scripts/apply_transaction_editor_v2.py

      - name: Validate JavaScript syntax
        run: |
          node --check apps/web/src/legacy-app.js
          node --check apps/web/src/transaction-editor.js
          node apps/web/src/transaction-editor.test.js
          node apps/web/src/legacy-finance.test.js
          node apps/web/src/legacy-state-patch.test.js

      - name: Commit final files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(web): reestruturar lançamentos e caixas de combinação [editor-v2-applied]"
          git push origin HEAD:agent/rebuild-web-transaction-editor
