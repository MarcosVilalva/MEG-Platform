name: RC1 JWT Security Upgrade

on:
  push:
    branches:
      - phoenix/v15-clean-room

permissions:
  contents: write

jobs:
  upgrade-jwt:
    if: contains(github.event.head_commit.message, 'execute jwt security upgrade')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Phoenix candidate
        uses: actions/checkout@v4
        with:
          ref: phoenix/v15-clean-room

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade JWT package and lock together
        shell: bash
        run: |
          cp package.json /tmp/root-package.json
          cp apps/web/package.json /tmp/web-package.json
          cp packages/database/package.json /tmp/database-package.json
          npm install --package-lock-only --ignore-scripts --workspace apps/api @fastify/jwt@10.2.2 --save-exact
          cmp -s package.json /tmp/root-package.json
          cmp -s apps/web/package.json /tmp/web-package.json
          cmp -s packages/database/package.json /tmp/database-package.json
          node <<'NODE'
          const fs = require('node:fs');
          const api = JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8'));
          if (api.dependencies?.['@fastify/jwt'] !== '10.2.2') {
            console.error('Versão final de @fastify/jwt não ficou fixada em 10.2.2.');
            process.exit(1);
          }
          NODE

      - name: Install upgraded dependency graph
        run: npm install --ignore-scripts

      - name: Verify JWT runtime import
        working-directory: apps/api
        run: node -e "import('@fastify/jwt').then((m) => { if (!m.default) process.exit(1); console.log('@fastify/jwt 10 runtime resolvido.'); })"

      - name: Run authentication regression
        run: npm run test:auth
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/meg
          NODE_ENV: test
          CORS_ORIGINS: http://localhost:5173

      - name: Build API with JWT 10
        run: npm run build:api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/meg
          NODE_ENV: test
          CORS_ORIGINS: http://localhost:5173

      - name: Verify critical audit findings removed
        shell: bash
        run: |
          npm audit --json > /tmp/jwt-upgrade-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/jwt-upgrade-audit.json', 'utf8'));
          const jwt = audit.vulnerabilities?.['@fastify/jwt'];
          const fastJwt = audit.vulnerabilities?.['fast-jwt'];
          if (jwt || fastJwt) {
            console.error('As vulnerabilidades JWT continuam presentes após a atualização.', { jwt, fastJwt });
            process.exit(1);
          }
          console.log('Bloqueadores críticos de JWT removidos do inventário npm audit.');
          NODE

      - name: Commit verified JWT security upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/package.json package-lock.json
          git diff --cached --quiet && { echo 'Nenhuma alteração de JWT para gravar.'; exit 0; }
          git commit -m 'fix(rc1): upgrade Fastify JWT to secure major'
          git push origin HEAD:phoenix/v15-clean-room
