<!doctype html>
<html lang="pt-BR" data-meg-shell="phoenix-v15">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#063437" />
    <meta name="meg-shell" content="phoenix-v15" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="./brand/meg-finance-system-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/phoenix-runtime-refinements.css" />
    <link rel="stylesheet" href="/assets/phoenix-card-premium.css" />
    <link rel="stylesheet" href="/assets/phoenix-mobile-login-fix.css" />
    <link rel="stylesheet" href="/assets/phoenix-v15-final-polish.css" />
    <link rel="stylesheet" href="/src/phoenix/phoenix-home-dashboard.css" />
    <link rel="stylesheet" href="/src/phoenix/phoenix-home-hero-v2.css" />
    <link rel="stylesheet" href="/src/phoenix/phoenix-avatar-pack.css" />
    <link rel="stylesheet" href="/src/phoenix/phoenix-bulk-meg-theme.css" />
    <link rel="stylesheet" href="/src/phoenix/phoenix-card-view-continuity.css" />
    <script>
      (() => {
        try {
          const defaults = { balance:true, projection:true, summary:true, benefit:true, history:true, agenda:true };
          const saved = JSON.parse(localStorage.getItem('meg.dashboard.preferences') || '{}');
          const preferences = { ...defaults, ...saved };
          Object.entries(preferences).forEach(([key, enabled]) => {
            const attribute = 'data-meg-dashboard-' + key.replace(/[A-Z]/g, (letter) => '-' + letter.toLowerCase());
            document.documentElement.setAttribute(attribute, enabled ? 'on' : 'off');
          });
        } catch {
          /* Preferências locais são opcionais e não bloqueiam a inicialização. */
        }
      })();
    </script>
    <title>MEG Finanças — Phoenix V15</title>
  </head>
  <body data-meg-shell="phoenix-v15">
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
