<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1034 638" role="img" aria-labelledby="t d">
<title id="t">Mercado Pago Visa</title>
<desc id="d">Arte local horizontal do cartão Mercado Pago Visa, com composição centralizada e margens seguras para o MEG.</desc>
<defs>
