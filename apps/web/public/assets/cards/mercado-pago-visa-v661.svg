    <stop offset="0" stop-color="#1c2533"/>
    <stop offset=".48" stop-color="#121b27"/>
    <stop offset="1" stop-color="#08111d"/>
  </linearGradient>
  <radialGradient id="glow" cx=".18" cy=".18" r=".95">
    <stop offset="0" stop-color="#506b8d" stop-opacity=".20"/>
    <stop offset=".48" stop-color="#25374f" stop-opacity=".07"/>
    <stop offset="1" stop-color="#08111d" stop-opacity="0"/>
