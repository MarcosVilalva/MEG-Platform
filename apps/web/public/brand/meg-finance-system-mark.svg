<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">MEG Finanças</title>
  <desc id="desc">Marca MEG com barras financeiras e seta de crescimento</desc>
  <defs>
