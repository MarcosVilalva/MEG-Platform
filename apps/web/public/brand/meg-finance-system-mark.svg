      <stop stop-color="#073E4A"/>
      <stop offset=".48" stop-color="#042B35"/>
      <stop offset="1" stop-color="#021923"/>
    </linearGradient>
    <linearGradient id="edge" x1="18" y1="20" x2="174" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36E6D7"/>
