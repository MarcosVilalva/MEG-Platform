  <text x="77" y="154" fill="url(#e)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-4">E</text>
  <text x="116" y="154" fill="url(#g)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-4">G</text>
