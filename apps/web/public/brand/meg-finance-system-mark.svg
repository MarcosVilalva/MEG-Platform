  <rect x="11" y="11" width="170" height="170" rx="48" fill="url(#tile)" stroke="url(#edge)" stroke-width="3" filter="url(#shadow)"/>
  <path d="M23 151C49 129 72 122 95 100c19-18 34-39 63-58" fill="none" stroke="#2BE5CB" stroke-opacity=".07" stroke-width="18"/>

