<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-labelledby="title desc">
  <title id="title">MEG Finanças</title>
  <desc id="desc">Marca MEG Finanças com barras financeiras, seta ascendente e assinatura FINANÇAS</desc>
  <defs>
    <linearGradient id="megArrow" x1="58" y1="65" x2="178" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1EA6E8"/>
      <stop offset=".52" stop-color="#1ADBDD"/>
      <stop offset="1" stop-color="#45EFB0"/>
    </linearGradient>
    <filter id="megGlow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#00161d" flood-opacity=".58"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#2debd4" flood-opacity=".18"/>
    </filter>
  </defs>
  <g filter="url(#megGlow)">
    <rect x="73" y="38" width="12" height="23" rx="2.5" fill="#249BD9"/>
    <rect x="97" y="25" width="12" height="36" rx="2.5" fill="#14C7E4"/>
    <rect x="121" y="9" width="12" height="52" rx="2.5" fill="#20D8C8"/>
    <path d="M55 72c32-4 58-19 81-43l-10-8 45-12-12 43-11-9c-25 25-53 39-87 41z"
      fill="url(#megArrow)" stroke="#C4FFF2" stroke-width="2.1" stroke-linejoin="round"/>

    <text x="39" y="120" fill="#FAFEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="61" font-weight="900">M</text>
    <text x="92" y="120" fill="#FAFEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="61" font-weight="900">E</text>
    <text x="139" y="120" fill="#FAFEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="61" font-weight="900">G</text>

    <text x="61" y="150" fill="#45EEDB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="850" letter-spacing="5.5">FINANÇAS</text>
  </g>
</svg>
