<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 156" role="img" aria-labelledby="title desc">
  <title id="title">MEG Finanças Evolution</title>
  <desc id="desc">Marca MEG Finanças com barras financeiras, seta de crescimento e assinatura FINANÇAS</desc>
  <defs>
    <linearGradient id="megArrow" x1="58" y1="64" x2="178" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21B8E8"/>
      <stop offset=".52" stop-color="#1ED8D8"/>
      <stop offset="1" stop-color="#35ECA2"/>
    </linearGradient>
    <filter id="megGlow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#00161D" flood-opacity=".48"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.1" flood-color="#3CE9D8" flood-opacity=".16"/>
    </filter>
  </defs>

  <g filter="url(#megGlow)">
    <rect x="75" y="37" width="12" height="23" rx="2.5" fill="#2AA5DF"/>
    <rect x="98" y="24" width="12" height="36" rx="2.5" fill="#20C8DF"/>
    <rect x="121" y="9" width="12" height="51" rx="2.5" fill="#25DDA7"/>
    <path d="M57 70c31-4 56-19 79-42l-10-8 44-12-12 42-10-8c-25 24-52 38-85 40z"
      fill="url(#megArrow)" stroke="#BFFFF0" stroke-width="2.1" stroke-linejoin="round"/>

    <text x="42" y="118" fill="#F8FCFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="900">M</text>
    <text x="92" y="118" fill="#F8FCFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="900">E</text>
    <text x="137" y="118" fill="#F8FCFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="900">G</text>

    <text x="63" y="145" fill="#54EADB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="850" letter-spacing="5.4">FINANÇAS</text>
  </g>
</svg>
