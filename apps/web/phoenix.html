    <script>
      (() => {
        try {
          const defaults = { balance:true, projection:true, summary:true, benefit:true, history:true, agenda:true };
          const saved = JSON.parse(localStorage.getItem('meg.dashboard.preferences') || '{}');
          const preferences = { ...defaults, ...saved };
          Object.entries(preferences).forEach(([key, enabled]) => {
            const attribute = 'data-meg-dashboard-' + key.replace(/[A-Z]/g, (letter) => '-' + letter.toLowerCase());
            document.documentElement.setAttribute(attribute, enabled ? 'on' : 'off');
          });
        } catch {
          /* Preferências locais são opcionais e não bloqueiam a inicialização. */
        }
      })();
    </script>
