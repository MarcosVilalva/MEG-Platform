<!doctype html>
<html lang="pt-BR" data-meg-web-evolution="true">
  <head>
    <link rel="icon" href="./brand/meg-finance-system-mark.svg" type="image/svg+xml" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02100f" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      html,body{margin:0;min-height:100%;background:#02100f}
      #meg-initial-boot{
        min-height:100vh;display:grid;place-items:center;color:#eefafa;
        font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
        background:radial-gradient(circle at 50% 35%,rgba(20,184,166,.22),transparent 55%),#02100f
      }
      #meg-initial-boot .meg-initial-center{width:min(82vw,310px);display:grid;justify-items:center;gap:28px}
      #meg-initial-boot img{display:block;width:min(42vw,164px);height:auto}
      #meg-initial-boot .meg-initial-track{width:100%;height:8px;border-radius:999px;overflow:hidden;border:1px solid rgba(45,212,191,.5);background:rgba(255,255,255,.06)}
      #meg-initial-boot .meg-initial-track>span{display:block;width:40%;height:100%;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#34f5b0);animation:meg-boot 1.2s ease-in-out infinite}
      #meg-initial-boot p{margin:-12px 0 0;font-size:14px;text-align:center}
      @keyframes meg-boot{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
    </style>
    <title>MEG Finanças</title>
  </head>
  <body>
    <div id="meg-web-evolution-root">
      <main id="meg-initial-boot" aria-live="polite" aria-busy="true" aria-label="Carregando MEG Finanças">
        <section class="meg-initial-center">
          <img src="./brand/meg-loading-lockup.svg" alt="MEG Finanças" />
          <div class="meg-initial-track" aria-hidden="true"><span></span></div>
          <p>Carregando seus dados...</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/meg-web-evolution/main.tsx"></script>
  </body>
</html>
